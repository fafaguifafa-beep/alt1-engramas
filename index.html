
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>GPS Engramas — Alt1 v2.1</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root {
  font-family: system-ui, Segoe UI, Arial, sans-serif;
  color: #f0f5f3;
  background: #111a1b;
  font-size: 13px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
button, input { font: inherit; }
button {
  cursor: pointer;
  border: 1px solid #425351;
  background: #253735;
  color: #f1f7f5;
  border-radius: 7px;
  padding: 8px;
}
button:hover { background: #31514a; }
.primary {
  background: #00ad74;
  color: #061b13;
  border: 0;
  font-weight: 700;
}
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #192727;
  border-bottom: 1px solid #364b45;
  padding: 9px 11px;
  gap: 8px;
}
header b { font-size: 15px; color: #62e5b6; }
header small { display: block; color: #9badab; }
#tools { display: flex; gap: 5px; }
#statusbar {
  padding: 9px 11px;
  background: #1c2e2d;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#title { font-size: 15px; font-weight: 700; }
#place {
  color: #bad2cd;
  padding: 3px 11px 8px;
  background: #1c2e2d;
  line-height: 1.45;
}
#map {
  min-height: 190px;
  flex: 1;
  background: #111d1c;
  position: relative;
}
#fallback {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: #12201e;
  z-index: 600;
  padding: 20px;
}
#mapActions {
  position: absolute;
  z-index: 500;
  right: 9px;
  bottom: 10px;
  display: flex;
  gap: 5px;
}
#mapActions button {
  background: #19352e;
  border-color: #386052;
}
#hint {
  background: #1a2927;
  border-top: 1px solid #334b46;
  padding: 9px 11px;
  line-height: 1.4;
}
#routeTitle { font-weight: 700; color: #68e8b6; }
#alternatives {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-top: 6px;
}
#alternatives button { padding: 5px 7px; font-size: 11px; }
#alternatives button.active {
  border-color: #31ca9a;
  color: #74ffcb;
}
#warning {
  font-size: 11px;
  color: #e7ca85;
  margin-top: 4px;
}
#transportStatus {
  font-size: 10px;
  color: #a8c7bf;
  margin-top: 4px;
}
#progress {
  color: #b9ccc6;
  font-size: 11px;
  text-align: center;
  padding: 5px;
}
footer {
  padding: 8px 11px;
  background: #182525;
  display: flex;
  gap: 6px;
}
footer button { flex: 1; }
#modal {
  position: fixed;
  inset: 0;
  background: #000b;
  z-index: 1200;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 9px;
}
#modal.open { display: flex; }
#sheet {
  background: #182827;
  border: 1px solid #42665b;
  border-radius: 10px;
  width: min(100%, 520px);
  max-height: 96vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#sheet h2 {
  margin: 0;
  padding: 13px;
  border-bottom: 1px solid #3d544f;
}
#settingsContent { overflow: auto; padding: 10px 13px; }
fieldset {
  border: 1px solid #35514b;
  border-radius: 8px;
  margin: 10px 0;
  padding: 9px;
}
legend {
  padding: 0 5px;
  color: #67e7b8;
  font-weight: 700;
}
.choice {
  display: flex;
  align-items: center;
  padding: 5px 0;
  gap: 9px;
}
.choice input {
  accent-color: #0cba83;
  width: 16px;
  height: 16px;
}
.note {
  color: #a8bbb6;
  font-size: 11px;
  line-height: 1.45;
}
.line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 8px 0;
}
.line input {
  width: 72px;
  background: #253937;
  color: white;
  border: 1px solid #527166;
  border-radius: 5px;
  padding: 6px;
}
#sheetFooter {
  display: flex;
  gap: 8px;
  padding: 10px 13px;
  border-top: 1px solid #35514b;
}
#sheetFooter button { flex: 1; }
.pin {
  background: #00c68f;
  border: 3px solid white;
  box-shadow: 0 0 0 2px #00593f, 0 2px 8px black;
  width: 20px;
  height: 20px;
  border-radius: 50%;
}
.teleicon {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 19px;
  height: 19px;
  border: 1.5px solid white;
  border-radius: 5px;
  font-size: 12px;
  background: #1b536b;
  box-shadow: 0 1px 5px #000a;
  color: white;
  font-weight: bold;
}
.teleicon.named {
  min-width: 22px;
  height: 22px;
  background: #165f5a;
}
.teleicon.highlight {
  background: #dd9822 !important;
  color: #171c12;
  outline: 2px solid #fff1aa;
}
.teleicon.community {
  opacity: .83;
  min-width: 18px;
  height: 18px;
  font-size: 11px;
}
#mapNote {
  position: absolute;
  top: 10px;
  left: 50px;
  right: 10px;
  z-index: 500;
  pointer-events: none;
  font-size: 11px;
}
#mapNote span {
  background: #162722d8;
  border-radius: 5px;
  padding: 4px 7px;
}
#legend {
  position: absolute;
  z-index: 500;
  left: 48px;
  bottom: 10px;
  background: #162722eb;
  border: 1px solid #45645c;
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 10px;
  pointer-events: none;
}
#legend[hidden] { display: none; }
#teleToggle.active {
  border-color: #00cf8b;
  background: #165744;
}
.leaflet-control-attribution { font-size: 8px !important; }
a { color: #8ddec7; }
</style>
</head>

<body>
<div id="app">
  <header>
    <div>
      <b>◈ GPS Engramas</b>
      <small>RuneScape 3 • Alt1</small>
    </div>
    <div id="tools">
      <button id="guide">Guia ↗</button>
      <button id="wiki">Wiki ↗</button>
      <button id="config">⚙ Config.</button>
    </div>
  </header>

  <div id="statusbar">
    <div>
      <div id="title">Carregando...</div>
      <small id="counter"></small>
    </div>
    <button id="list">☷ Lista</button>
  </div>

  <div id="place"></div>

  <div id="map">
    <div id="fallback">Mapa indisponível.</div>
    <div id="mapNote">
      <span>Arraste para explorar • Roda do mouse para zoom</span>
    </div>
    <div id="legend" hidden>
      ● Destino · ⌂ Magnetitas · ◇ Joias · ✦ Magias · ◎ Fadas · ⚑ Outros
    </div>
    <div id="mapActions">
      <button id="teleToggle" class="active">✦ Teleportes</button>
      <button id="recenter">⌖ Centralizar</button>
      <button id="external">↗ Mapa</button>
      <button id="setPin" style="display:none">📍 Ajustar</button>
    </div>
  </div>

  <div id="hint">
    <div id="routeTitle"></div>
    <div id="routeText"></div>
    <div id="alternatives"></div>
    <div id="transportStatus"></div>
    <div id="warning"></div>
  </div>

  <div id="progress"></div>

  <footer>
    <button id="prev">← Anterior</button>
    <button id="done" class="primary">✓ Coletado e próximo</button>
    <button id="next">Próximo →</button>
  </footer>
</div>

<div id="modal" role="dialog" aria-modal="true">
  <div id="sheet">
    <h2 id="sheetTitle">⚙ Configurações</h2>
    <div id="settingsContent"></div>
    <div id="sheetFooter">
      <button id="cancel">Cancelar</button>
      <button id="save" class="primary">Salvar configurações</button>
    </div>
  </div>
</div>

const CAT_LABELS = {
  magnetita:'Magnetitas',
  joia:'Joias e acessórios',
  magia:'Feitiços e tabuletas',
  fada:'Anéis de fada',
  especial:'Outros transportes',
  minijogo:'Minijogos',
  equipamento:'Capas e trajes'
};

const CAT_ICONS = {
  magnetita:'⌂', joia:'◇', magia:'✦',
  fada:'◎', especial:'⚑', minijogo:'⚑',
  equipamento:'✧'
};

const DEFAULT_CATS = {
  magnetita:true, joia:true, magia:true,
  fada:true, especial:true, minijogo:true,
  equipamento:false
};

const $ = id => document.getElementById(id);
let communityPoints = [];
let communityLoaded = false;
let communityError = false;

function load() {
  try {
    const latest = JSON.parse(localStorage.getItem(STORE));
    if (latest) return latest;
  } catch(e) {}
  return {};
}

let state = Object.assign({
  index:0,
  prestige:1,
  done:{},
  teleports:Object.fromEntries(TELE.map(t=>[t.id,!!t.default])),
  selected:{},
  pins:{},
  showAll:true,
  communityCats:{...DEFAULT_CATS},
  showTeleports:true
}, load());

state.communityCats = Object.assign(
  {}, DEFAULT_CATS, state.communityCats || {}
);

if (state.showTeleports === undefined) state.showTeleports = true;

function save() {
  try {
    localStorage.setItem(STORE,JSON.stringify(state));
  } catch(e) {
    alert('Não foi possível salvar neste navegador.');
  }
}

const here = () => ENGRAMAS[state.index];

function coords(e) {
  const custom = state.pins[e.id];
  return custom || (e.x === null ? null : {
    map:e.map, x:e.x, y:e.y, verified:false
  });
}

function routes(e) {
  return e.routes.filter(([id]) => state.teleports[id]);
}

function picked(e) {
  const opts = routes(e);
  return opts.find(([id]) => id === state.selected[e.id])
      || opts[0] || null;
}

function communityAllowed(cat) {
  return !!state.communityCats[cat];
}

function loadCommunity() {
  fetch(TELEPORT_DATA)
    .then(r => {
      if (!r.ok) throw Error('HTTP ' + r.status);
      return r.json();
    })
    .then(data => {
      if (!Array.isArray(data)) throw Error('Invalid data');

      const seen = new Set();

      communityPoints = data.flatMap(raw => {
        const dest = raw.destination;
        const def = EXTRA_CATS[raw.groupName];

        if (!def || !dest || dest.plane !== 0 ||
            !Number.isFinite(dest.x) ||
            !Number.isFinite(dest.y)) return [];

        if (dest.x < 1600 || dest.x > 4900 ||
            dest.y < 2400 || dest.y > 4600) return [];

        const key = def[0]+':'+dest.x+':'+dest.y;
        if (seen.has(key)) return [];

        seen.add(key);
        return [{
          cat:def[0],
          label:raw.groupName,
          x:dest.x,
          y:dest.y
        }];
      });

      communityLoaded = true;
      communityError = false;
      if (map) draw(false);
    })
    .catch(() => {
      communityError = true;
      communityLoaded = false;
      renderTransportStatus();
    });
}

function renderTransportStatus() {
  $('transportStatus').textContent = communityError
    ? 'Base extra indisponível (somente teleportes identificados).'
    : communityLoaded
      ? 'Mapa: teleportes identificados + ' +
        communityPoints.length +
        ' pontos comunitários.'
      : 'Carregando pontos de transporte...';
}

function iconFor(cat, named=false, chosen=false) {
  const text = CAT_ICONS[cat] || '⚑';
  return L.divIcon({
    className:'',
    html:`<div class="teleicon ${named?'named':'community'} ${chosen?'highlight':''}">${text}</div>`,
    iconSize:[named?22:18,named?22:18],
    iconAnchor:[named?11:9,named?11:9]
  });
}

function knownCategory(t) {
  if (t.cat === 'Magnetitas') return 'magnetita';
  if (t.cat === 'Feitiços') return 'magia';
  if (t.id === 'fairyring') return 'fada';
  return 'joia';
}

let baseLayer = null;
let iconLayer = null;
let destMarker = null;
let transportLayer = null;
let pickMode = false;
let currentMapId = null;

function tileLayer(kind,id) {
  const RS3Layer = L.TileLayer.extend({
    getTileUrl(c) {
      return `${BASE}/${kind}/${id}/${c.z}/0_${c.x}_${-1-c.y}.png`;
    }
  });

  return new RS3Layer('',{
    minZoom:-2,
    maxZoom:4,
    maxNativeZoom:3,
    noWrap:true,
    tileSize:256,
    attribution:'Mapa: mejrs / RuneScape Wiki • © Jagex'
  });
}

function ensureMap() {
  if (map || typeof L === 'undefined') return;

  map = L.map('map',{
    crs:L.CRS.Simple,
    zoomControl:true,
    zoomSnap:1,
    minZoom:-2,
    maxZoom:4,
    attributionControl:true
  });

  transportLayer = L.layerGroup().addTo(map);

  map.on('click', function(ev) {
    if (!pickMode) return;
    const p = here();
    const c = coords(p);
    if (!c) return;

    state.pins[p.id] = {
      map:c.map,
      x:Math.round(ev.latlng.lng),
      y:Math.round(ev.latlng.lat),
      verified:true
    };

    save();
    pickMode = false;
    $('setPin').textContent = '📍 Ajustar';
    update();
  });
}

function draw(shiftMap=true) {
  ensureMap();

  const p = here();
  const c = coords(p);

  if (!map) {
    $('fallback').style.display = 'flex';
    return;
  }

  $('fallback').style.display = c ? 'none' : 'flex';

  if (!c) {
    $('fallback').innerHTML =
      'Área especial sem coordenada confirmada. Consulte a Wiki.';
    return;
  }

  const mapChanged = currentMapId !== c.map;

  if (mapChanged) {
    if (baseLayer) map.removeLayer(baseLayer);
    if (iconLayer) map.removeLayer(iconLayer);

    baseLayer = tileLayer('map_squares',c.map).addTo(map);
    iconLayer = tileLayer('icon_squares',c.map).addTo(map);
    currentMapId = c.map;

    const limits = c.map === 28
      ? [[1344,1856],[4544,4736]]
      : [[c.y-160,c.x-160],[c.y+160,c.x+160]];

    map.setMaxBounds(limits);
  }

  if (destMarker) map.removeLayer(destMarker);

  destMarker = L.marker([c.y,c.x],{
    icon:L.divIcon({
      className:'',
      html:'<div class="pin"></div>',
      iconSize:[20,20],
      iconAnchor:[10,10]
    }),
    title:p.nome
  }).addTo(map).bindPopup(
    p.nome + ' — posição ' +
    (c.verified ? 'ajustada' : 'aproximada')
  );

  transportLayer.clearLayers();

  const chosen = picked(p);

  $('teleToggle').classList.toggle(
    'active',state.showTeleports
  );

  $('legend').hidden = !state.showTeleports;
  renderTransportStatus();

  if (state.showTeleports) {

    if (c.map === 28) {
      communityPoints
        .filter(t=>communityAllowed(t.cat))
        .forEach(t=>{
          L.marker([t.y,t.x],{
            icon:iconFor(t.cat),
            title:CAT_LABELS[t.cat]+' (base comunitária)'
          }).addTo(transportLayer).bindPopup(
            '<b>'+CAT_LABELS[t.cat]+'</b><br>'+
            'Destino: '+t.x+', '+t.y+
            '<br><small>Nome individual não fornecido.</small>'
          );
        });
    }

    TELE.filter(t=>
      t.map === c.map &&
      state.teleports[t.id] &&
      (state.showAll || p.routes.some(([id])=>id===t.id))
    ).forEach(t=>{
      const isChosen = !!(chosen && chosen[0]===t.id);

      const marker = L.marker([t.y,t.x],{
        icon:iconFor(knownCategory(t),true,isChosen),
        title:t.label,
        zIndexOffset:isChosen?600:300
      }).addTo(transportLayer);

      marker.bindPopup(
        '<b>'+t.label+'</b><br>'+
        (isChosen
          ? 'Recomendado para este engrama'
          : 'Teleporte habilitado')
      );

      marker.on('click',()=>{
        if (state.teleports[t.id] &&
            p.routes.some(([id])=>id===t.id)) {
          state.selected[p.id]=t.id;
          save();
          update(false);
        }
      });
    });
  }

  if (shiftMap || mapChanged) {
    map.setView([c.y,c.x], c.map===28?2:3,{
      animate:false
    });
  }

  setTimeout(()=>map.invalidateSize(),75);
}

function update(shiftMap=true) {
  const e = here();
  const c = coords(e);

  $('title').textContent = e.nome+' — '+e.regiao;
  $('counter').textContent =
    `Engrama ${state.index+1} de ${ENGRAMAS.length} · Prestígio ${state.prestige}`;
  $('place').textContent = e.desc;

  $('wiki').onclick = () =>
    window.open(wiki(e.nome+'_engram'),'_blank');

  $('guide').onclick = () =>
    window.open(GUIDE,'_blank');

  const avail = routes(e);
  const best = picked(e);

  $('routeTitle').textContent = best
    ? 'Teleporte sugerido: '+TELE.find(t=>t.id===best[0]).label
    : 'Nenhum teleporte configurado para este engrama';

  $('routeText').textContent = best
    ? best[1]
    : 'Abra ⚙ Config. e habilite um transporte indicado.';

  $('warning').textContent = [
    e.req,
    c&&!c.verified
      ? 'Pino aproximado: ajuste para obter o ponto exato.'
      : '',
    !c
      ? 'Área especial: consulte as instruções.'
      : ''
  ].filter(Boolean).join(' · ');

  $('alternatives').replaceChildren();

  avail.forEach(([id])=>{
    const b = document.createElement('button');
    b.textContent = TELE.find(t=>t.id===id).label;
    b.className = best&&best[0]===id?'active':'';
    b.onclick = ()=>{
      state.selected[e.id]=id;
      save();
      update(false);
    };
    $('alternatives').appendChild(b);
  });

  const done = state.done[state.prestige] || {};
  const count = ENGRAMAS.filter(x=>done[x.id]).length;

  $('progress').textContent =
    `${count}/12 coletados · `+
    (done[e.id]?'✓ Atual concluído':'Pendente')+
    ' · Alterações salvas localmente';

  $('done').textContent = done[e.id]
    ? '↩ Desmarcar'
    : '✓ Coletado e próximo';

  save();
  draw(shiftMap);
}

function jump(step) {
  state.index =
    (state.index+step+ENGRAMAS.length)%ENGRAMAS.length;
  update();
}

$('prev').onclick = ()=>jump(-1);
$('next').onclick = ()=>jump(1);

$('done').onclick = ()=>{
  const e = here();
  state.done[state.prestige] ||= {};

  if (state.done[state.prestige][e.id]) {
    delete state.done[state.prestige][e.id];
    update();
  } else {
    state.done[state.prestige][e.id]=true;
    jump(1);
  }
};

$('recenter').onclick = ()=>{
  const c = coords(here());
  if (map && c) map.setView(
    [c.y,c.x],c.map===28?2:3
  );
};

$('teleToggle').onclick = ()=>{
  state.showTeleports = !state.showTeleports;
  save();
  draw(false);
};

$('external').onclick = ()=>{
  const c = coords(here());
  const url = c
    ? `${MAP_EXTERNAL}?m=${c.map}&x=${c.x}&y=${c.y}&z=3`
    : wiki('Engram');
  window.open(url,'_blank');
};

$('setPin').onclick = ()=>{
  if (!coords(here())) {
    alert('Este engrama não tem mapa confirmado.');
    return;
  }
  pickMode = !pickMode;
  $('setPin').textContent = pickMode
    ? 'Clique no mapa…'
    : '📍 Ajustar';
};

function closeModal() {
  $('modal').classList.remove('open');
}

function openModal(kind) {
  $('modal').classList.add('open');
  $('settingsContent').replaceChildren();
  $('save').style.display='block';

  if (kind==='list') {
    $('sheetTitle').textContent='Escolha um engrama';
    $('save').style.display='none';
    $('cancel').textContent='Fechar';

    ENGRAMAS.forEach((e,i)=>{
      const b = document.createElement('button');
      b.style='width:100%;text-align:left;margin:3px 0';
      b.textContent =
        `${state.done[state.prestige]?.[e.id]?'✓':'○'} `+
        `${i+1}. ${e.nome} — ${e.regiao}`;
      b.onclick=()=>{
        state.index=i;
        closeModal();
        update();
      };
      $('settingsContent').appendChild(b);
    });
    return;
  }

  $('sheetTitle').textContent='⚙ Meus teleportes';
  $('cancel').textContent='Cancelar';

  const draft = {...state.teleports};

  const line = document.createElement('div');
  line.className='line';
  line.innerHTML =
    '<b>Prestígio atual</b>'+
    '<input id="prestigeValue" type="number" min="1" max="999" value="'+
    state.prestige+'">';
  $('settingsContent').appendChild(line);

  const actions = document.createElement('div');
  actions.className='line';
  actions.innerHTML =
    '<button id="all">Marcar todos</button>'+
    '<button id="none">Desmarcar todos</button>';
  $('settingsContent').appendChild(actions);

  const checkboxes={};

  for (const cat of [...new Set(TELE.map(t=>t.cat))]) {
    const f=document.createElement('fieldset');
    const leg=document.createElement('legend');
    leg.textContent=cat;
    f.appendChild(leg);

    TELE.filter(t=>t.cat===cat).forEach(t=>{
      const l=document.createElement('label');
      l.className='choice';

      const input=document.createElement('input');
      input.type='checkbox';
      input.checked=!!draft[t.id];
      input.onchange=()=>draft[t.id]=input.checked;

      checkboxes[t.id]=input;
      l.append(input,document.createTextNode(t.label));
      f.appendChild(l);
    });

    $('settingsContent').appendChild(f);
  }

  $('all').onclick=()=>{
    TELE.forEach(t=>{
      draft[t.id]=true;
      checkboxes[t.id].checked=true;
    });
  };

  $('none').onclick=()=>{
    TELE.forEach(t=>{
      draft[t.id]=false;
      checkboxes[t.id].checked=false;
    });
  };

  const show=document.createElement('label');
  show.className='choice';
  show.innerHTML =
    '<input id="showAll" type="checkbox"> Mostrar todos os meus teleportes no mapa';
  $('settingsContent').appendChild(show);
  $('showAll').checked=state.showAll;

  const groupBox=document.createElement('fieldset');
  const groupLeg=document.createElement('legend');
  groupLeg.textContent='Ícones extras no mapa';
  groupBox.appendChild(groupLeg);

  const groupDraft={...state.communityCats};

  for (const [cat,label] of Object.entries(CAT_LABELS)) {
    const l=document.createElement('label');
    l.className='choice';

    const input=document.createElement('input');
    input.type='checkbox';
    input.checked=!!groupDraft[cat];
    input.onchange=()=>groupDraft[cat]=input.checked;

    l.append(input,document.createTextNode(label));
    groupBox.appendChild(l);
  }

  const info=document.createElement('p');
  info.className='note';
  info.textContent =
    'Os pontos extras são destinos comunitários. A base não fornece nomes individuais nem requisitos. Eles são referências visuais e não entram nas sugestões automáticas.';
  groupBox.appendChild(info);
  $('settingsContent').appendChild(groupBox);

  const manual=document.createElement('button');
  manual.textContent='📍 Corrigir o pino deste engrama';
  manual.style='width:100%;margin:8px 0';
  manual.onclick=()=>{
    closeModal();
    $('setPin').click();
  };
  $('settingsContent').appendChild(manual);

  const note=document.createElement('p');
  note.className='note';
  note.textContent =
    'Os desbloqueios são informados manualmente. O addon recomenda a primeira rota cadastrada disponível, não a rota calculada mais rápida.';
  $('settingsContent').appendChild(note);

  const reset=document.createElement('button');
  reset.textContent='Limpar ajustes manuais dos pinos';
  reset.onclick=()=>{
    if (confirm('Apagar posições ajustadas no mapa?')) {
      state.pins={};
      save();
      alert('Ajustes removidos.');
    }
  };
  $('settingsContent').appendChild(reset);

  $('save').onclick=()=>{
    state.prestige=Math.max(
      1,Math.min(999,Number($('prestigeValue').value)||1)
    );
    state.teleports=draft;
    state.showAll=$('showAll').checked;
    state.communityCats=groupDraft;
    save();
    closeModal();
    update();
  };
}

$('config').onclick=()=>openModal('config');
$('list').onclick=()=>openModal('list');
$('cancel').onclick=closeModal;

if (typeof L==='undefined') {
  $('fallback').style.display='flex';
  $('fallback').textContent='Não foi possível carregar o mapa.';
}

update();
loadCommunity();
</script>
</body>
</html>
