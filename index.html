 },
 {

 },
 {

  where:'Entre duas rochas ao norte do World Gate, a noroeste dos três pequenos lagos.',
  routes:[
   ['sixthage','worldgate','No Sixth-Age circuit, escolha a opção 2 (World Gate) e siga para norte.'],
   ['travellersnecklace','outpost','No Traveller’s necklace, escolha a opção 2 (Outpost) e siga para oeste.'],

  ]
 },
 {

  routes:[

   ['home','yanille','Da magnetita de Yanille, entre pelo noroeste e siga junto à parede oeste até virar a leste.']
  ]
 },
 {
  id:'time',n:'Time',area:'Glarial’s Tombstone',m:28,x:2556,y:3440,
  where:'Sob um arbusto ao norte de uma árvore, ao sul e um pouco a oeste da lápide de Glarial.',
  routes:[
   ['luckofthedwarves','outpost','Com Dark Facet of Luck, escolha a opção 4 (Dwarven Outpost), depois siga para sudoeste.'],
   ['skillsnecklace','fishing','No Skills necklace, escolha a opção 1 (Fishing Guild); siga para noroeste.'],
   ['home','ardougne','Da magnetita de Ardougne, vá a noroeste, além da Fishing Guild.']
  ]
 },
 {
  id:'naragi',n:'Naragi',area:'Naragun',m:649,x:2016,y:5984,
  where:'Na casa de Guthix: do anel AIS, siga para norte e depois para oeste até o fim do caminho.',
  req:'No tutorial, Orla entrega o engrama. Para coletá-lo após o prestígio, é necessário acesso via The World Wakes.',
  routes:[
   ['fairyring','AIS','Use um anel de fada com o código AIS, siga para norte e depois oeste até a casa de Guthix.']
  ]
 }
];

function storage(k){
 try{return JSON.parse(localStorage.getItem(k))||{}}
 catch(_){return {}}
}
const old=storage('gps-engramas-v2'),base=storage(KEY);

let state={
 index:base.index??old.index??0,
 prestige:base.prestige??old.prestige??1,
 done:base.done??old.done??{},
 pins:base.pins??old.pins??{},
 selected:base.selected??{},
 enabled:base.enabled??{
  home:true,
  normalspellbook:true,
  ringofduelling:true,
  gamesnecklace:true,
  fairyring:true,
  sixthage:true,
  skillsnecklace:true,
  travellersnecklace:true,
  luckofthedwarves:true
 },
 showAll:base.showAll??true,
 showTP:base.showTP??true,
 compact:base.compact??false
};

state.index=Math.max(0,Math.min(E.length-1,state.index));
const persist=()=>{
 try{localStorage.setItem(KEY,JSON.stringify(state))}
 catch(e){console.warn('Falha ao salvar',e)}
};
const current=()=>E[state.index];
const point=e=>state.pins[e.id]||{x:e.x,y:e.y,m:e.m};

let groups=[],spots=[],map=null,tiles=null,markers=null,pin=null,mapId=null,editing=false;

// Interpreta os campos públicos do TypeScript
// sem executar código remoto.
function closing(s,start,open,stop){
 let depth=0,quote='',comment='';
 for(let i=start;i<s.length;i++){
  const c=s[i],n=s[i+1];
  if(comment==='line'){
   if(c==='\n')comment='';
   continue;
  }
  if(comment==='block'){
   if(c==='*'&&n==='/'){i++;comment=''}
   continue;
  }
  if(quote){
   if(c==='\\'){i++;continue}
   if(c===quote)quote='';
   continue;
  }
  if(c==='/'&&n==='/'){i++;comment='line';continue}
  if(c==='/'&&n==='*'){i++;comment='block';continue}
  if(c==='"'||c==="'"||c==='`'){quote=c;continue}
  if(c===open)depth++;
  if(c===stop&&--depth===0)return i;
 }
 return -1;
}
function objects(s){
 const out=[];let p=0;
 while(p<s.length){
  const a=s.indexOf('{',p);
  if(a<0)break;
  const b=closing(s,a,'{','}');
  if(b<0)break;
  out.push(s.slice(a,b+1));
  p=b+1;
 }
 return out;
}
function stringProp(s,key){
 const match=new RegExp(
  String.raw`\b${key}\s*:\s*(?:"([^"]*)"|'([^']*)')`
 ).exec(s);
 return match?(match[1]??match[2]):'';
}
function imageProp(s){
 const m=/\bimg\s*:\s*\{\s*url\s*:\s*(?:"([^"]*)"|'([^']*)')/.exec(s);
 return m?(m[1]??m[2]):'';
}
function origin(s){
 const m=/(?:"?origin"?)\s*:\s*\{\s*"?x"?\s*:\s*(-?\d+)\s*,\s*"?y"?\s*:\s*(-?\d+)\s*,\s*"?level"?\s*:\s*(-?\d+)/.exec(s);
 return m?{x:+m[1],y:+m[2],level:+m[3]}:null;
}
function parseSource(text){
 const begin=text.indexOf('= [',text.indexOf('const raw_data'));
 if(begin<0)throw Error('Formato do arquivo alterado');
 const a=begin+2,b=closing(text,a,'[',']');
 if(b<0)throw Error('Lista incompleta');
 const groupList=[],all=[];
 for(const g of objects(text.slice(a+1,b))){
  if(!/\btype\s*:\s*['"]teleports['"]/.test(g))continue;
  const si=/\bspots\s*:\s*\[/.exec(g);
  if(!si)continue;
  const sb=g.indexOf('[',si.index),se=closing(g,sb,'[',']');
  if(se<0)continue;
  const head=g.slice(0,si.index),tail=g.slice(se+1);
  const id=stringProp(head,'id');
  const name=stringProp(head,'name')||id;
  const icon=imageProp(head)||imageProp(tail);
  if(!id)continue;
  groupList.push({id,name});
  for(const s of objects(g.slice(sb+1,se))){
   const o=origin(s);
   if(!o)continue;
   all.push({
    ...o,group:id,groupName:name,
    id:stringProp(s,'id'),
    name:stringProp(s,'name')||name,
    code:stringProp(s,'code'),
    icon:imageProp(s)||icon
   });
  }
 }
 if(all.length<400)throw Error('Dados incompletos');
 return {groups:groupList,spots:all};
}
async function loadTeleports(){
 try{
  const cached=storage('gps-transportes-cache-v1');
  let data=cached.spots?.length>=400?cached:null;
  if(!data||Date.now()-(data.ts||0)>7*86400000){
   const r=await fetch(SOURCE);
   if(!r.ok)throw Error('HTTP '+r.status);
   data=parseSource(await r.text());
   data.ts=Date.now();
   try{
    localStorage.setItem(
     'gps-transportes-cache-v1',JSON.stringify(data)
    );
   }catch(_){}
  }
  groups=data.groups;
  spots=data.spots;
  $('notice').textContent=
   `${spots.length} destinos disponíveis · clique nos ícones`;
 }catch(err){
  const cached=storage('gps-transportes-cache-v1');
  if(cached.spots?.length>=400){
   groups=cached.groups;
   spots=cached.spots;
   $('notice').textContent='Usando dados de teleportes salvos';
  }else{
   $('notice').textContent=
    'Não foi possível carregar os teleportes: '+err.message;
  }
 }
 renderMarkers();
}

function mapFor(t){
 if(t.group==='fairyring'&&t.id==='AIP')return 1;
 if(t.group==='fairyring'&&t.id==='AIS')return 649;
 if(t.x>=1664&&t.x<=1728&&t.y>=5568&&t.y<=5632)return 105;
 if(t.x>=3200&&t.x<=3264&&t.y>=9472&&t.y<=9536)return 634;
 if(t.x>=2368&&t.x<=2512&&t.y>=4352&&t.y<=4488)return 1;
 if(t.x>=1984&&t.x<=2048&&t.y>=5952&&t.y<=6016)return 649;
 if(t.level===0&&t.x>=1800&&t.x<=5800&&t.y>=2400&&t.y<=4600)return 28;
 return -1;
}
function selectedRoute(e){
 return e.routes.find(r=>
  state.selected[e.id]===r[0]+':'+r[1]&&
  state.enabled[r[0]]!==false
 )||
 e.routes.find(r=>state.enabled[r[0]]!==false)||
 e.routes[0];
}
function tpOf(route){
 return spots.find(t=>t.group===route[0]&&t.id===route[1]);
}
function badgeIcon(t,isBest){
 const root=document.createElement('div');
 root.className='tp'+(isBest?' best':'');
 const fallback=document.createElement('span');
 fallback.className='fallback';
 fallback.textContent='✦';
 if(t.icon){
  const img=document.createElement('img');
  img.src=ICONS+encodeURIComponent(t.icon);
  img.alt='';
  img.onerror=()=>{
   img.remove();
   root.prepend(fallback);
  };
  root.append(img);
 }else root.append(fallback);
 if(t.code){
  const k=document.createElement('span');
  k.className='key';
  k.textContent=t.code;
  root.append(k);
 }
 return L.divIcon({
  className:'',html:root,
  iconSize:[30,30],iconAnchor:[15,15]
 });
}
function leafletMap(){
 if(map||typeof L==='undefined')return;
 map=L.map('map',{
  crs:L.CRS.Simple,
  zoomControl:true,
  minZoom:-3,
  maxZoom:4,
  zoomSnap:1,
  attributionControl:true
 });
 markers=L.layerGroup().addTo(map);
 map.on('moveend zoomend',renderMarkers);
 map.on('click',event=>{
  if(!editing)return;
  const e=current();
  state.pins[e.id]={
   x:Math.round(event.latlng.lng),
   y:Math.round(event.latlng.lat),
   m:e.m
  };
  editing=false;
  persist();
  render();
 });
}
function renderMap(){
 leafletMap();
 if(!map){
  $('notice').textContent='Mapa indisponível: Leaflet não carregou';
  return;
 }
 const e=current(),p=point(e);
 if(mapId!==e.m){
  if(tiles)map.removeLayer(tiles);
  const Tile=L.TileLayer.extend({
   getTileUrl(c){
    return `${TILES}/${e.m}/${c.z}/0_${c.x}_${-1-c.y}.png`;
   }
  });
  tiles=new Tile('',{
   minZoom:-3,maxZoom:4,maxNativeZoom:3,
   tileSize:256,noWrap:true,
   attribution:'Mapa: mejrs / RuneScape Wiki • © Jagex'
  }).addTo(map);
  mapId=e.m;
 }
 if(pin)pin.remove();
 pin=L.marker([p.y,p.x],{
  icon:L.divIcon({
   className:'',
   html:'<div class="dest"></div>',
   iconSize:[21,21],
   iconAnchor:[10,10]
  }),
  zIndexOffset:1000
 }).addTo(map);
 const popup=document.createElement('div');
 popup.textContent=`${e.n}: ${e.where} (pino aproximado)`;
 pin.bindPopup(popup);
 map.setView([p.y,p.x],e.m===28?2:3,{animate:false});
 setTimeout(()=>map.invalidateSize(),60);
 renderMarkers();
}
function renderMarkers(){
 if(!map||!markers)return;
 markers.clearLayers();
 if(!state.showTP)return;
 const e=current(),chosen=selectedRoute(e);
 const bounds=map.getBounds().pad(.35);
 for(const t of spots){
  if(
   state.enabled[t.group]===false||
   !state.enabled[t.group]||
   mapFor(t)!==e.m
  )continue;
  if(
   !state.showAll&&
   !e.routes.some(r=>r[0]===t.group&&r[1]===t.id)
  )continue;
  if(!bounds.contains([t.y,t.x]))continue;
  const isBest=chosen[0]===t.group&&chosen[1]===t.id;
  const marker=L.marker([t.y,t.x],{
   icon:badgeIcon(t,isBest),
   title:t.groupName+' — '+t.name,
   zIndexOffset:isBest?900:0
  }).addTo(markers);
  const popup=document.createElement('div');
  const label=document.createElement('b');
  label.textContent=t.groupName+' — '+t.name;
  popup.append(label);
  const info=document.createElement('div');
  info.textContent=t.code
   ?'Tecla / código: '+t.code
   :'Sem tecla fixa cadastrada';
  popup.append(info);
  if(e.routes.some(r=>r[0]===t.group&&r[1]===t.id)){
   const b=document.createElement('button');
   b.textContent='Usar como rota';
   b.onclick=()=>{
    state.selected[e.id]=t.group+':'+t.id;
    persist();
    renderText();
    renderMarkers();
    map.closePopup();
   };
   popup.append(b);
  }
  marker.bindPopup(popup);
 }
}
function renderText(){
 const e=current(),r=selectedRoute(e),t=tpOf(r);
 const done=state.done[state.prestige]||{};
 $('name').textContent=e.n+' — '+e.area;
 $('count').textContent=
  `Engrama ${state.index+1}/12 · Prestígio ${state.prestige}`;
 $('chosen').textContent='Teleporte: '+
  (t?t.groupName+' → '+t.name+
   (t.code?' ['+t.code+']':''):r[0]);
 $('walk').textContent='1. '+r[2];
 $('spot').textContent='2. Local do engrama: '+e.where;
 $('requirement').textContent=
  (e.req?'⚠ '+e.req+' · ':'')+
  (state.pins[e.id]
   ?'Pino ajustado por você.'
   :'Pino do engrama aproximado.');
 $('choices').replaceChildren();
 for(const option of e.routes){
  if(state.enabled[option[0]]===false)continue;
  const b=document.createElement('button');
  const tp=tpOf(option);
  b.textContent=tp
   ?tp.groupName+' '+(tp.code||tp.name)
   :option[0];
  b.className=(option===r?'active':'');
  b.onclick=()=>{
   state.selected[e.id]=option[0]+':'+option[1];
   persist();
   renderText();
   renderMarkers();
  };
  $('choices').append(b);
 }
 $('done').textContent=done[e.id]
  ?'↶ Desmarcar'
  :'✓ Coletado e próximo';
 $('status').textContent=
  `${E.filter(x=>done[x.id]).length}/12 coletados · Progresso salvo neste navegador`;
 $('guide').style.display=state.compact?'none':'block';
 $('toggleGuide').textContent=state.compact
  ?'▸ Roteiro':'▾ Roteiro';
 $('toggleTP').textContent=state.showTP
  ?'Teleportes ✓':'Teleportes ✕';
 $('wiki').onclick=()=>window.open(WIKI,'_blank');
}
function render(){
 renderText();
 renderMap();
 persist();
}
function advance(d){
 state.index=(state.index+d+E.length)%E.length;
 render();
}
$('prev').onclick=()=>advance(-1);
$('next').onclick=()=>advance(1);
$('done').onclick=()=>{
 let d=state.done[state.prestige]||
  (state.done[state.prestige]={});
 let id=current().id;
 if(d[id]){
  delete d[id];
  renderText();
  persist();
 }else{
  d[id]=true;
  advance(1);
 }
};
$('center').onclick=()=>{
 if(map){
  const p=point(current());
  map.setView([p.y,p.x],current().m===28?2:3);
 }
};
$('toggleTP').onclick=()=>{
 state.showTP=!state.showTP;
 persist();
 renderText();
 renderMarkers();
};
$('toggleGuide').onclick=()=>{
 state.compact=!state.compact;
 persist();
 renderText();
 setTimeout(()=>map?.invalidateSize(),30);
};

function openDialog(title){
 $('modalTitle').textContent=title;
 $('body').replaceChildren();
 $('overlay').classList.add('show');
 $('save').style.display='block';
}
function closeDialog(){
 $('overlay').classList.remove('show');
}
$('cancel').onclick=closeDialog;

function addCheck(parent,label,checked){
 const l=document.createElement('label');
 l.className='opt';
 const c=document.createElement('input');
 c.type='checkbox';
 c.checked=checked;
 l.append(c,document.createTextNode(label));
 parent.append(l);
 return c;
}
$('list').onclick=()=>{
 openDialog('Selecionar engrama');
 $('save').style.display='none';
 for(const [i,e] of E.entries()){
  const b=document.createElement('button');
  b.style='display:block;width:100%;text-align:left;margin:4px 0';
  b.textContent=
   (state.done[state.prestige]?.[e.id]?'✓ ':'○ ')+
   (i+1)+'. '+e.n+' — '+e.area;
  b.onclick=()=>{
   state.index=i;
   closeDialog();
   render();
  };
  $('body').append(b);
 }
};
$('settings').onclick=()=>{
 openDialog('⚙ Configurações de teleportes');
 const draft={...state.enabled};
 const row=document.createElement('div');
 row.className='row';
 row.textContent='Prestígio atual';
 const num=document.createElement('input');
 num.type='number';
 num.min=1;num.max=999;
 num.value=state.prestige;
 row.append(num);
 $('body').append(row);

 const all=addCheck(
  $('body'),
  'Mostrar todos os teleportes habilitados (não só as rotas deste engrama)',
  state.showAll
 );
 const show=addCheck(
  $('body'),
  'Mostrar ícones de teleporte no mapa',
  state.showTP
 );
 const search=document.createElement('input');
 search.type='search';
 search.placeholder='Buscar item ou teleporte…';
 $('body').append(search);

 const choices=document.createElement('fieldset');
 const leg=document.createElement('legend');
 leg.textContent='Transportes que você possui';
 choices.append(leg);
 $('body').append(choices);
 const checks=[];
 for(const g of groups){
  const c=addCheck(choices,g.name,!!draft[g.id]);
  c.onchange=()=>draft[g.id]=c.checked;
  checks.push({g,c,l:c.parentElement});
 }
 if(!groups.length){
  choices.append(document.createTextNode(
   'A lista de teleportes não carregou. Verifique sua conexão.'
  ));
 }
 search.oninput=()=>checks.forEach(({g,l})=>{
  l.style.display=g.name.toLowerCase().includes(
   search.value.toLowerCase()
  )?'flex':'none';
 });

 const reset=document.createElement('button');
 reset.textContent='📍 Corrigir posição do engrama no mapa';
 reset.style='width:100%;margin-top:10px';
 reset.onclick=()=>{
  editing=true;
  closeDialog();
  $('notice').textContent=
   'Clique no ponto do engrama no mapa para salvar o pino.';
 };
 $('body').append(reset);
 const note=document.createElement('p');
 note.className='dim';
 note.textContent=
  'As teclas do mapa vêm do Clue Trainer. Favoritos e Passage of the Abyss podem alterar os números usados no jogo. O addon não aperta teclas por você.';
 $('body').append(note);

 $('save').onclick=()=>{
  state.prestige=Math.max(
   1,Math.min(999,Number(num.value)||1)
  );
  state.enabled=draft;
  state.showAll=all.checked;
  state.showTP=show.checked;
  closeDialog();
  render();
 };
};

render();
loadTeleports();
</script>
</body>
</html>
