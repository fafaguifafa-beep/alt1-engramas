function read(k){
 try{return JSON.parse(localStorage.getItem(k))||{}}
 catch(_){return {}}
}

const prev=read('gps-engramas-v4');
const v2=read('gps-engramas-v2');
const latest=read(STORE);

let state={
 index:latest.index??prev.index??v2.index??0,
 prestige:latest.prestige??prev.prestige??v2.prestige??1,
 done:latest.done??prev.done??v2.done??{},
 selected:latest.selected??prev.selected??{},
 enabled:latest.enabled??prev.enabled??{
  home:true,
  normalspellbook:true,
  ringofduelling:true,
  gamesnecklace:true,
  fairyring:true,
  sixthage:true,
  skillsnecklace:true,
  travellersnecklace:true,
  luckofthedwarves:true
 },
 showTP:latest.showTP??prev.showTP??true,
 showAll:latest.showAll??prev.showAll??false,
 showPath:latest.showPath??true,
 compact:latest.compact??prev.compact??false,
 autoRoute:latest.autoRoute??true
};

state.index=Math.max(0,Math.min(11,state.index));

function persist(){
 try{
  localStorage.setItem(STORE,JSON.stringify(state))
 }catch(e){
  console.warn(e)
 }
}

const current=()=>E[state.index];

// Os pontos são sempre os definidos no código.
// Não são lidos nem salvos ajustes manuais.
const point=e=>({x:e.x,y:e.y,m:e.m});

let groups=[];
let spots=[];
let map=null;
let baseTile=null;
let tpLayer=null;
let destPin=null;
let pathLayer=null;
let activeMap=null;

let pathEpoch=0;
let pathResults=[];
let pathMessage='';

// ====================================================
// LEITURA DOS TELEPORTES
// ====================================================

// Analisa somente texto TypeScript.
// Não executa o conteúdo remoto.

function closeAt(s,start,op,cl){
 let dep=0,q='',com='';

 for(let i=start;i<s.length;i++){
  let c=s[i],n=s[i+1];

  if(com==='line'){
   if(c==='\n')com='';
   continue
  }

  if(com==='block'){
   if(c==='*'&&n==='/'){
    i++;
    com=''
   }
   continue
  }

  if(q){
   if(c==='\\'){
    i++;
    continue
   }
   if(c===q)q='';
   continue
  }

  if(c==='/'&&n==='/'){
   i++;
   com='line';
   continue
  }

  if(c==='/'&&n==='*'){
   i++;
   com='block';
   continue
  }

  if(c==='"'||c==="'"||c==='`'){
   q=c;
   continue
  }

  if(c===op)dep++;

  if(c===cl&&--dep===0)return i;
 }

 return -1;
}

function objList(s){
 let out=[],p=0;

 while(p<s.length){
  let a=s.indexOf('{',p);
  if(a<0)break;

  let b=closeAt(s,a,'{','}');
  if(b<0)break;

  out.push(s.slice(a,b+1));
  p=b+1
 }

 return out
}

function prop(s,k){
 let m=new RegExp(
  String.raw`\b${k}\s*:\s*(?:"([^"]*)"|'([^']*)')`
 ).exec(s);

 return m?(m[1]??m[2]):''
}

function icon(s){
 let m=/\bimg\s*:\s*\{\s*url\s*:\s*(?:"([^"]*)"|'([^']*)')/.exec(s);
 return m?(m[1]??m[2]):''
}

function origin(s){
 let m=/(?:"?origin"?)\s*:\s*\{\s*"?x"?\s*:\s*(-?\d+)\s*,\s*"?y"?\s*:\s*(-?\d+)\s*,\s*"?level"?\s*:\s*(-?\d+)/.exec(s);

 return m?{
  x:+m[1],
  y:+m[2],
  level:+m[3]
 }:null
}

function parseTeleports(s){
 let st=s.indexOf(
  '= [',
  s.indexOf('const raw_data')
 );

 if(st<0)throw Error('Formato desconhecido');

 let a=st+2;
 let b=closeAt(s,a,'[',']');

 if(b<0)throw Error('Arquivo incompleto');

 let gs=[],ss=[];

 for(let group of objList(s.slice(a+1,b))){
  if(!/\btype\s*:\s*['"]teleports['"]/.test(group)){
   continue
  }

  let match=/\bspots\s*:\s*\[/.exec(group);
  if(!match)continue;

  let p=group.indexOf('[',match.index);
  let e=closeAt(group,p,'[',']');
  if(e<0)continue;

  let head=group.slice(0,match.index);
  let tail=group.slice(e+1);

  let id=prop(head,'id');
  let name=prop(head,'name')||id;
  let im=icon(head)||icon(tail);

  if(!id)continue;

  gs.push({id,name});

  for(let one of objList(group.slice(p+1,e))){
   let o=origin(one);
   if(!o)continue;

   ss.push({
    ...o,
    group:id,
    groupName:name,
    id:prop(one,'id'),
    name:prop(one,'name')||name,
    code:prop(one,'code'),
    icon:icon(one)||im
   })
  }
 }

 if(ss.length<400){
  throw Error('Destinos insuficientes')
 }

 return {groups:gs,spots:ss}
}

async function loadTeleports(){
 try{
  let data=read('gps-transportes-cache-v1');

  if(data.spots?.length<400||!data.spots){
   let r=await fetch(TELE_DATA);

   if(!r.ok)throw Error('HTTP '+r.status);

   data=parseTeleports(await r.text());

   try{
    localStorage.setItem(
     'gps-transportes-cache-v1',
     JSON.stringify(data)
    )
   }catch(_){}
  }

  groups=data.groups;
  spots=data.spots;

  $('msg').textContent=
   spots.length+' destinos de teleporte';

 }catch(err){
  $('msg').textContent=
   'Teleporte indisponível: '+err.message
 }

 renderText();
 drawTeleports();
 await calculateRoutes();
}

function teleMap(t){
 if(t.group==='fairyring'&&t.id==='AIP')return 1;
 if(t.group==='fairyring'&&t.id==='AIS')return 649;

 if(
  t.x>=1664&&t.x<=1728&&
  t.y>=5568&&t.y<=5632
 )return 105;

 if(
  t.x>=3200&&t.x<=3264&&
  t.y>=9472&&t.y<=9536
 )return 634;

 if(
  t.x>=2368&&t.x<=2512&&
  t.y>=4352&&t.y<=4488
 )return 1;

 if(
  t.x>=1984&&t.x<=2048&&
  t.y>=5952&&t.y<=6016
 )return 649;

 if(
  t.level===0&&
  t.x>=1800&&t.x<=5800&&
  t.y>=2400&&t.y<=4600
 )return 28;

 return -1
}

function routeKey(r){
 return r[0]+':'+r[1]
}

function teleportOf(r){
 return spots.find(t=>
  t.group===r[0]&&t.id===r[1]
 )
}

function usable(e){
 return e.routes.filter(r=>
  state.enabled[r[0]]===true
 )
}

function preferredRoute(e){
 const options=usable(e);

 if(!options.length)return e.routes[0];

 const chosen=options.find(r=>
  routeKey(r)===state.selected[e.id]
 );

 if(chosen)return chosen;

 if(state.autoRoute){
  const found=pathResults
   .filter(p=>
    p.engram===e.id&&
    p.path?.length>0&&
    options.some(r=>routeKey(r)===p.key)
   )
   .sort((a,b)=>a.steps-b.steps);

  if(found.length){
   return options.find(r=>
    routeKey(r)===found[0].key
   )
  }
 }

 return options[0]
}

function tpIcon(t,best){
 const container=document.createElement('div');
 container.className='tp'+(best?' best':'');

 const fallback=document.createElement('span');
 fallback.className='fallback';
 fallback.textContent='✦';

 if(t.icon){
  const image=document.createElement('img');
  image.src=ICONS+encodeURIComponent(t.icon);
  image.alt='';

  image.onerror=()=>{
   image.remove();
   container.prepend(fallback)
  };

  container.append(image)
 }else{
  container.append(fallback)
 }

 if(t.code){
  const span=document.createElement('span');
  span.className='key';
  span.textContent=t.code;
  container.append(span)
 }

 return L.divIcon({
  className:'',
  html:container,
  iconSize:[30,30],
  iconAnchor:[15,15]
 })
}

// MAPA
// ====================================================

function setupMap(){
 if(map||typeof L==='undefined')return;

 map=L.map('map',{
  crs:L.CRS.Simple,
  zoomControl:true,
  minZoom:-3,
  maxZoom:4,
  zoomSnap:1,
  attributionControl:true
 });

 pathLayer=L.layerGroup().addTo(map);
 tpLayer=L.layerGroup().addTo(map);

 map.on('moveend zoomend',drawTeleports)
}

function drawMap(){
 setupMap();

 if(!map){
  $('msg').textContent=
   'Mapa indisponível (Leaflet não carregou)';
  return
 }

 const e=current();
 const p=point(e);

 if(activeMap!==e.m){
  if(baseTile)map.removeLayer(baseTile);

  const Tile=L.TileLayer.extend({
   getTileUrl(c){
    return `${TILES}/${e.m}/${c.z}/0_${c.x}_${-1-c.y}.png`
   }
  });

  baseTile=new Tile('',{
   tileSize:256,
   minZoom:-3,
   maxZoom:4,
   maxNativeZoom:3,
   noWrap:true,
   attribution:'Mapa: mejrs / RuneScape Wiki • © Jagex'
  }).addTo(map);

  activeMap=e.m
 }

 if(destPin)destPin.remove();

 destPin=L.marker([p.y,p.x],{
  icon:L.divIcon({
   className:'',
   html:'<div class="dest"></div>',
   iconSize:[21,21],
   iconAnchor:[10,10]
  }),
  zIndexOffset:1000
 }).addTo(map);

 destPin.bindPopup(
  `${e.n} — ${e.where} (coordenada em revisão)`
 );

 map.setView(
  [p.y,p.x],
  e.m===28?2:3,
  {animate:false}
 );

 setTimeout(()=>map.invalidateSize(),60);

 drawTeleports();
 drawRoute()
}

function drawTeleports(){
 if(!map||!tpLayer)return;

 tpLayer.clearLayers();
 if(!state.showTP)return;

 let e=current();
 let r=preferredRoute(e);
 let bounds=map.getBounds().pad(.3);

 for(let t of spots){
  if(
   state.enabled[t.group]!==true||
   teleMap(t)!==e.m
  )continue;

  if(
   !state.showAll&&
   !e.routes.some(x=>
    x[0]===t.group&&x[1]===t.id
   )
  )continue;

  if(!bounds.contains([t.y,t.x]))continue;

  const isBest=
   routeKey(r)===t.group+':'+t.id;

  let marker=L.marker([t.y,t.x],{
   icon:tpIcon(t,isBest),
   title:t.groupName+' — '+t.name,
   zIndexOffset:isBest?800:0
  }).addTo(tpLayer);

  let popup=document.createElement('div');
  let heading=document.createElement('b');

  heading.textContent=
   t.groupName+' — '+t.name;

  popup.append(heading);

  let code=document.createElement('div');

  code.textContent=t.code
   ?'Opção: '+t.code
   :'Sem tecla fixa';

  popup.append(code);

  if(
   e.routes.some(x=>
    x[0]===t.group&&x[1]===t.id
   )
  ){
   let choose=document.createElement('button');
   choose.textContent='Usar este teleporte';

   choose.onclick=()=>{
    state.selected[e.id]=t.group+':'+t.id;

    persist();
    renderText();
    drawRoute();
    drawTeleports();
    map.closePopup()
   };

   popup.append(choose)
  }

  marker.bindPopup(popup)
 }
}

// ====================================================
// CÁLCULO DE CAMINHOS: A*
// ====================================================

// Dados de colisão organizados em blocos 1280x1280.
// Cada byte indica os movimentos possíveis por tile:
// oeste, norte, leste, sul, noroeste,
// nordeste, sudeste e sudoeste.

const SIZE=1280;

const DIRS=[
 [-1,0,1],
 [0,1,2],
 [1,0,4],
 [0,-1,8],
 [-1,1,16],
 [1,1,32],
 [1,-1,64],
 [-1,-1,128]
];

const collisionCache=new Map();

async function collisionFile(fx,fy,level){
 const k=`${fx}-${fy}-${level}`;

 if(!collisionCache.has(k)){
  collisionCache.set(k,(async()=>{
   if(typeof pako==='undefined'){
    throw Error('Descompactador indisponível')
   }

   const url=`${COLLISION}collision-${k}.bin`;
   const r=await fetch(url);

   if(!r.ok){
    throw Error('Colisão HTTP '+r.status)
   }

   const bytes=pako.inflate(
    new Uint8Array(await r.arrayBuffer())
   );

   if(bytes.length!==SIZE*SIZE){
    throw Error('Arquivo de colisão incompatível')
   }

   return bytes
  })())
 }

 return collisionCache.get(k)
}

class MinHeap{
 constructor(){
  this.a=[]
 }

 push(n){
  let a=this.a,i=a.length;
  a.push(n);

  while(i>0){
   let p=(i-1)>>1;

   if(a[p][0]<=n[0])break;

   a[i]=a[p];
   i=p
  }

  a[i]=n
 }

 pop(){
  let a=this.a;

  if(!a.length)return null;

  let first=a[0];
  let last=a.pop();

  if(a.length){
   let i=0;

   while(true){
    let c=i*2+1;

    if(c>=a.length)break;

    if(
     c+1<a.length&&
     a[c+1][0]<a[c][0]
    )c++;

    if(a[c][0]>=last[0])break;

    a[i]=a[c];
    i=c
   }

   a[i]=last
  }

  return first
 }

 get size(){
  return this.a.length
 }
}

const h=(a,b)=>
 Math.max(
  Math.abs(a.x-b.x),
  Math.abs(a.y-b.y)
 );

function aStar(start,goal,at,box){
 let {minX,minY,maxX,maxY}=box;
 let w=maxX-minX+1;

 const key=(x,y)=>
  (y-minY)*w+x-minX;

 function near(p,radius){
  for(let d=0;d<=radius;d++){
   for(let dy=-d;dy<=d;dy++){
    for(let dx=-d;dx<=d;dx++){
     if(
      Math.max(
       Math.abs(dx),
       Math.abs(dy)
      )!==d
     )continue;

     const x=p.x+dx;
     const y=p.y+dy;

     if(
      x<minX||x>maxX||
      y<minY||y>maxY
     )continue;

     if(at(x,y)!==0){
      return {x,y}
     }
    }
   }
  }

  return null
 }

 const s=near(start,5);
 const g=near(goal,8);

 if(!s||!g)return null;

 const begin=key(s.x,s.y);
 const target=key(g.x,g.y);

 const open=new MinHeap();
 const score=new Map([[begin,0]]);
 const parent=new Map();

 open.push([h(s,g),0,s.x,s.y]);

 let count=0;

 while(open.size&&count++<170000){
  const [f,c,x,y]=open.pop();
  const i=key(x,y);

  if(score.get(i)!==c)continue;

  if(i===target){
   const path=[];
   let k=i;

   while(k!==undefined){
    let yy=Math.floor(k/w)+minY;
    let xx=(k%w)+minX;

    path.push([yy,xx]);
    k=parent.get(k)
   }

   path.reverse();

   let smooth=[path[0]];
   let lastDir=null;

   for(let j=1;j<path.length;j++){
    const dir=[
     Math.sign(
      path[j][1]-path[j-1][1]
     ),
     Math.sign(
      path[j][0]-path[j-1][0]
     )
    ].join(',');

    if(dir!==lastDir&&j>1){
     smooth.push(path[j-1])
    }

    lastDir=dir
   }

   if(path.length>1){
    smooth.push(path[path.length-1])
   }

   return {
    path:smooth,
    steps:path.length-1,
    trimStart:h(s,start),
    trimEnd:h(g,goal)
   }
  }

  const mask=at(x,y);

  for(const [dx,dy,bit] of DIRS){
   if(!(mask&bit))continue;

   const nx=x+dx;
   const ny=y+dy;

   if(
    nx<minX||nx>maxX||
    ny<minY||ny>maxY
   )continue;

   const ni=key(nx,ny);
   const nc=c+1;

   if(
    nc>=(score.get(ni)??Infinity)
   )continue;

   score.set(ni,nc);
   parent.set(ni,i);

   open.push([
    nc+h({x:nx,y:ny},g),
    nc,
    nx,
    ny
   ])
  }
 }

 return null
}

async function findWalkPath(start,goal,level){
 if(h(start,goal)>440)return null;

 const margin=110;

 const box={
  minX:Math.max(
   0,
   Math.min(start.x,goal.x)-margin
  ),
  minY:Math.max(
   0,
   Math.min(start.y,goal.y)-margin
  ),
  maxX:Math.max(start.x,goal.x)+margin,
  maxY:Math.max(start.y,goal.y)+margin
 };

 const chunks=new Map();
 const jobs=[];

 for(
  let fy=Math.floor(box.minY/SIZE);
  fy<=Math.floor(box.maxY/SIZE);
  fy++
 ){
  for(
   let fx=Math.floor(box.minX/SIZE);
   fx<=Math.floor(box.maxX/SIZE);
   fx++
  ){
   jobs.push(
    collisionFile(fx,fy,level)
     .then(bytes=>
      chunks.set(`${fx},${fy}`,bytes)
     )
   )
  }
 }

 await Promise.all(jobs);

 const at=(x,y)=>{
  if(
   x<box.minX||x>box.maxX||
   y<box.minY||y>box.maxY
  )return 0;

  const fx=Math.floor(x/SIZE);
  const fy=Math.floor(y/SIZE);
  const c=chunks.get(`${fx},${fy}`);

  return c
   ?c[(y%SIZE)*SIZE+(x%SIZE)]
   :0
 };

 // Libera a interface antes da busca.
 await new Promise(resolve=>setTimeout(resolve,0));

 return aStar(start,goal,at,box)
}

// ====================================================
// ESCOLHA AUTOMÁTICA DAS ROTAS
// ====================================================

async function calculateRoutes(){
 const epoch=++pathEpoch;
 const e=current();

 pathResults=[];

 if(!state.showPath){
  pathMessage='Rota visual desativada.';
  drawRoute();
  renderText();
  return
 }

 if(!spots.length){
  pathMessage='Aguardando a base de teleportes.';
  drawRoute();
  renderText();
  return
 }

 pathMessage='Calculando caminho caminhável…';

 renderText();
 drawRoute();

 const valid=usable(e)
  .map(r=>({
   route:r,
   t:teleportOf(r)
  }))
  .filter(({route,t})=>
   t&&
   teleMap(t)===e.m&&
   t.level===0
  );

 // Evita desenhar uma linha falsa atravessando o mar
 // ou usando a coordenada problemática de World Gate.
 if(e.id==='elder'||e.id==='world'){
  pathMessage=
   'Este destino exige conferência de coordenadas '+
   'ou uma travessia. Siga as instruções da Wiki.';

  drawRoute();
  renderText();
  return
 }

 if(!valid.length){
  pathMessage=
   'A rota envolve outro mapa ou transporte especial; '+
   'siga as instruções por etapas.';

  drawRoute();
  renderText();
  return
 }

 const all=await Promise.all(
  valid.map(async ({route,t})=>{
   try{
    const p=await findWalkPath(
     {x:t.x,y:t.y},
     {x:e.x,y:e.y},
     t.level
    );

    return p?{
     ...p,
     key:routeKey(route),
     engram:e.id
    }:null;

   }catch(error){
    return {
     key:routeKey(route),
     engram:e.id,
     error:error.message
    }
   }
  })
 );

 // Impede que uma busca antiga altere o novo engrama.
 if(epoch!==pathEpoch)return;

 pathResults=all.filter(x=>x?.path);

 const fails=all.filter(x=>x?.error);

 pathMessage=pathResults.length
  ?'Rota caminhável encontrada nos dados de colisão do RS3.'
  :fails.length
   ?'Dados de colisão indisponíveis ('+
    fails[0].error+'). Siga a Wiki.'
   :'Não foi possível calcular caminho caminhável até esse pino.';

 drawRoute();
 renderText();
 drawTeleports()
}

function drawRoute(){
 if(!map||!pathLayer)return;

 pathLayer.clearLayers();
 if(!state.showPath)return;

 const e=current();
 const key=routeKey(preferredRoute(e));

 const result=pathResults.find(p=>
  p.engram===e.id&&p.key===key
 );

 if(!result)return;

 const points=result.path;

 // Contorno escuro para destacar a rota no mapa.
 L.polyline(points,{
  color:'#102821',
  weight:8,
  opacity:.8,
  lineJoin:'round',
  interactive:false
 }).addTo(pathLayer);

 // Caminho caminhável.
 L.polyline(points,{
  color:'#65f5b6',
  weight:4,
  opacity:.95,
  lineJoin:'round',
  interactive:false
 }).addTo(pathLayer);

 // Início da caminhada, após o teleporte.
 L.circleMarker(points[0],{
  radius:5,
  color:'#edfdf4',
  weight:2,
  fillColor:'#2e84eb',
  fillOpacity:1,
  interactive:false
 }).addTo(pathLayer)
}

// ====================================================
// INTERFACE
// ====================================================

function renderText(){
 const e=current();
 const r=preferredRoute(e);
 const t=teleportOf(r);

 const done=state.done[state.prestige]||{};

 $('title').textContent=e.n+' — '+e.area;

 $('counter').textContent=
  `Engrama ${state.index+1}/12 · Prestígio ${state.prestige}`;

 $('teleTitle').textContent=
  !usable(e).length
   ?'Nenhum teleporte habilitado'
   :t
    ?`Teleporte: ${t.groupName} → ${t.name}${t.code?' ['+t.code+']':''}`
    :'Teleporte: '+r[0];

 $('instructions').textContent='1. '+r[2];

 $('where').textContent=
  '2. Local do engrama: '+e.where;

 const result=pathResults.find(p=>
  p.engram===e.id&&
  p.key===routeKey(r)
 );

 $('routeStatus').textContent=result
  ?`↳ ${result.steps} passos de caminhada calculados a partir do teleporte`+
   (
    state.autoRoute&&!state.selected[e.id]
     ?' · menor caminhada entre as rotas verificadas'
     :''
   )+
   '. '+
   (
    result.trimEnd
     ?'O destino foi aproximado à casa caminhável mais próxima.'
     :''
   )
  :pathMessage;

 $('warning').textContent=
  (e.req?'⚠ '+e.req+' · ':'')+
  'Pinos fixos (coordenadas em revisão).';

 $('choices').replaceChildren();

 for(let option of usable(e)){
  const btn=document.createElement('button');
  const tp=teleportOf(option);

  btn.textContent=tp
   ?tp.groupName+' '+(tp.code||tp.name)
   :option[0];

  if(routeKey(option)===routeKey(r)){
   btn.className='active'
  }

  btn.onclick=()=>{
   state.selected[e.id]=routeKey(option);

   persist();
   renderText();
   drawRoute();
   drawTeleports()
  };

  $('choices').append(btn)
 }

 $('done').textContent=
  done[e.id]?'↶ Desmarcar':'✓ Coletado e próximo';

 $('progress').textContent=
  `${E.filter(x=>done[x.id]).length}/12 coletados · Progresso salvo`;

 $('routeBox').style.display=
  state.compact?'none':'block';

 $('collapse').textContent=
  state.compact?'▸ Roteiro':'▾ Roteiro';

 $('showTeleports').textContent=
  state.showTP?'Teleportes ✓':'Teleportes ✕';

 $('showPath').textContent=
  state.showPath?'Rota ✓':'Rota ✕';

 $('wiki').onclick=()=>
  window.open(WIKI,'_blank')
}

function render(){
 ++pathEpoch;
 pathResults=[];
 pathMessage='';

 renderText();
 drawMap();
 persist();
 calculateRoutes()
}

function advance(n){
 state.index=
  (state.index+n+E.length)%E.length;

 render()
}

$('prev').onclick=()=>advance(-1);
$('next').onclick=()=>advance(1);

$('done').onclick=()=>{
 const d=state.done[state.prestige]||
  (state.done[state.prestige]={});

 const e=current();

 if(d[e.id]){
  delete d[e.id];
  renderText();
  persist()
 }else{
  d[e.id]=true;
  advance(1)
 }
};

$('center').onclick=()=>{
 if(map){
  const p=point(current());

  map.setView(
   [p.y,p.x],
   current().m===28?2:3
  )
 }
};

$('showTeleports').onclick=()=>{
 state.showTP=!state.showTP;
 persist();
 renderText();
 drawTeleports()
};

$('showPath').onclick=()=>{
 state.showPath=!state.showPath;
 persist();

 if(state.showPath){
  calculateRoutes()
 }else{
  ++pathEpoch;
  pathResults=[];
  pathMessage='Rota visual desativada.';
  renderText();
  drawRoute()
 }
};

$('collapse').onclick=()=>{
 state.compact=!state.compact;
 persist();
 renderText();

 setTimeout(
  ()=>map?.invalidateSize(),
  50
 )
};

// ====================================================
// LISTA E CONFIGURAÇÕES
// ====================================================

function openModal(title){
 $('modalTitle').textContent=title;
 $('modalBody').replaceChildren();
 $('overlay').classList.add('show');
 $('save').style.display='block'
}

function closeModal(){
 $('overlay').classList.remove('show')
}

$('cancel').onclick=closeModal;

function addCheckbox(parent,label,checked){
 let l=document.createElement('label');
 l.className='check';

 let c=document.createElement('input');
 c.type='checkbox';
 c.checked=checked;

 l.append(c,document.createTextNode(label));
 parent.append(l);

 return c
}

$('list').onclick=()=>{
 openModal('Selecionar engrama');
 $('save').style.display='none';

 const d=state.done[state.prestige]||{};

 E.forEach((e,i)=>{
  let b=document.createElement('button');

  b.style=
   'width:100%;text-align:left;margin:3px 0';

  b.textContent=
   (d[e.id]?'✓ ':'○ ')+
   (i+1)+'. '+e.n+' — '+e.area;

  b.onclick=()=>{
   state.index=i;
   closeModal();
   render()
  };

  $('modalBody').append(b)
 })
};

$('settings').onclick=()=>{
 openModal('⚙ Configurações');

 let draft={...state.enabled};

 let row=document.createElement('label');
 row.textContent='Prestígio atual: ';

 let num=document.createElement('input');
 num.type='number';
 num.min=1;
 num.max=999;
 num.value=state.prestige;

 row.append(num);
 $('modalBody').append(row);

 const auto=addCheckbox(
  $('modalBody'),
  'Escolher automaticamente a menor caminhada calculada',
  state.autoRoute
 );

 const all=addCheckbox(
  $('modalBody'),
  'Mostrar todos os teleportes habilitados no mapa',
  state.showAll
 );

 const path=addCheckbox(
  $('modalBody'),
  'Mostrar caminho caminhável no mapa',
  state.showPath
 );

 const search=document.createElement('input');
 search.type='search';
 search.placeholder='Buscar teleporte…';

 $('modalBody').append(search);

 const field=document.createElement('fieldset');
 field.append(document.createElement('legend'));
 field.firstChild.textContent='Meus teleportes';

 $('modalBody').append(field);

 const list=[];

 for(let g of groups){
  const c=addCheckbox(
   field,
   g.name,
   !!draft[g.id]
  );

  c.onchange=()=>{
   draft[g.id]=c.checked
  };

  list.push({
   g,
   row:c.parentElement
  })
 }

 if(!groups.length){
  field.append(
   'A lista de transportes ainda não carregou.'
  )
 }

 search.oninput=()=>{
  list.forEach(({g,row})=>{
   row.style.display=
    g.name.toLowerCase().includes(
     search.value.toLowerCase()
    )
     ?'flex'
     :'none'
  })
 };

 // Restauração dos pinos antigos.
 // Não altera progresso nem os teleportes.
 const reset=document.createElement('button');

 reset.textContent=
  '↺ Restaurar posições originais';

 reset.style=
  'width:100%;margin-top:8px';

 reset.onclick=()=>{
  for(let key of [
   'gps-engramas-v2',
   'gps-engramas-v4',
   'gps-engramas-v5'
  ]){
   const s=read(key);

   if(s.pins){
    delete s.pins;

    try{
     localStorage.setItem(
      key,
      JSON.stringify(s)
     )
    }catch(_){}
   }
  }

  closeModal();
  render()
 };

 $('modalBody').append(reset);

 let note=document.createElement('p');
 note.className='dim';

 note.textContent=
  'As rotas usam dados de colisão externos do Clue Trainer. '+
  'O percurso mais curto considera apenas caminhada no mapa: '+
  'não calcula automaticamente portas, barcos, tempo de animação, '+
  'Surge nem Dive. Os pontos dos engramas ainda precisam ser auditados.';

 $('modalBody').append(note);

 $('save').onclick=()=>{
  state.prestige=Math.max(
   1,
   Math.min(999,Number(num.value)||1)
  );

  state.enabled=draft;
  state.showAll=all.checked;
  state.autoRoute=auto.checked;
  state.showPath=path.checked;

  if(state.autoRoute){
   state.selected[current().id]=undefined
  }

  closeModal();
  render()
 }
};

// Inicialização.
render();
loadTeleports();

</script>
