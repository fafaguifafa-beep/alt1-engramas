function shownCode(t){

function closeBalanced(s,start,op,cl){
 let depth=0;
 let quote='';
 let comment='';

 for(let i=start;i<s.length;i++){
  const ch=s[i];
  const n=s[i+1];

  if(comment==='line'){
   if(ch==='\n')comment='';
   continue;
  }

  if(comment==='block'){
   if(ch==='*'&&n==='/'){
    comment='';
    i++;
   }
   continue;
  }

  if(quote){
   if(ch==='\\'){
    i++;
    continue;
   }

   if(ch===quote)quote='';
   continue;
  }

  if(ch==='/'&&n==='/'){
   comment='line';
   i++;
   continue;
  }

  if(ch==='/'&&n==='*'){
   comment='block';
   i++;
   continue;
  }

  if(ch==='"'||ch==="'"||ch==='`'){
   quote=ch;
   continue;
  }

  if(ch===op)depth++;

  if(ch===cl&&--depth===0)return i;
 }

 return -1;
}

function objects(s){
 const out=[];
 let pos=0;

 while(pos<s.length){
  const a=s.indexOf('{',pos);

  if(a<0)break;

  const b=closeBalanced(s,a,'{','}');

  if(b<0)break;

  out.push(s.slice(a,b+1));
  pos=b+1;
 }

 return out;
}

function value(s,key){
 const m=new RegExp(
  String.raw`\b${key}\s*:\s*(?:"([^"]*)"|'([^']*)')`
 ).exec(s);

 return m?(m[1]??m[2]):'';
}

function img(s){
 const m=/\bimg\s*:\s*\{\s*url\s*:\s*(?:"([^"]*)"|'([^']*)')/.exec(s);
 return m?(m[1]??m[2]):'';
}

function coords(s){
 const m=/(?:"?origin"?)\s*:\s*\{\s*"?x"?\s*:\s*(-?\d+)\s*,\s*"?y"?\s*:\s*(-?\d+)\s*,\s*"?level"?\s*:\s*(-?\d+)/.exec(s);

 return m
  ?{x:+m[1],y:+m[2],level:+m[3]}
  :null;
}

function targetSize(s){
 const start=/\btarget\s*:\s*\{/.exec(s);

 if(!start){
  return {width:1,height:1};
 }

 const from=s.indexOf('{',start.index);
 const to=closeBalanced(s,from,'{','}');

 if(to<0){
  return {width:1,height:1};
 }

 const part=s.slice(from,to+1);

 const m=/["']?size["']?\s*:\s*\{\s*["']?x["']?\s*:\s*(\d+)\s*,\s*["']?y["']?\s*:\s*(\d+)/.exec(part);

 return m
  ?{
   width:Math.min(+m[1],16),
   height:Math.min(+m[2],16)
  }
  :{width:1,height:1};
}

function mapFor(t){

 if(t.group==='fairyring'&&t.id==='AIP')return 1;
 if(t.group==='fairyring'&&t.id==='AIS')return 649;

 if(
  t.x>=1660&&t.x<1750&&
  t.y>=5500&&t.y<5700
 )return 105;

  t.x>=3160&&t.x<3300&&
  t.y>=9420&&t.y<9610

 if(
  t.x>=2340&&t.x<2540&&
  t.y>=4310&&t.y<4530
 )return 1;

 if(
  t.x>=1950&&t.x<2120&&
  t.y>=5900&&t.y<6080
 )return 649;

 if(
  t.level===0&&
  t.x>=1800&&t.x<6000&&
  t.y>=2400&&t.y<4400
 )return 28;

 return -1;
}

function parseData(text){
 const raw=text.indexOf('const raw_data');
 const match=/=\s*\[/.exec(text.slice(raw));

 if(raw<0||!match){
  throw Error('Formato de teleportes não identificado');
 }

 const start=
  raw+match.index+match[0].lastIndexOf('[');

 const end=closeBalanced(text,start,'[',']');

 if(end<0){
  throw Error('Fonte de teleportes incompleta');
 }

 const gs=[];
 const ts=[];

 for(const group of objects(text.slice(start+1,end))){
  if(!/\btype\s*:\s*['"]teleports['"]/.test(group)){
   continue;
  }

  const spotMatch=/\bspots\s*:\s*\[/.exec(group);
  if(!spotMatch)continue;

  const a=group.indexOf('[',spotMatch.index);
  const b=closeBalanced(group,a,'[',']');

  if(b<0)continue;

  const head=group.slice(0,spotMatch.index);
  const g=value(head,'id');

  if(!g)continue;

  const groupName=value(head,'name')||g;

  // A imagem pode estar no cabeçalho ou
  // no item de acesso, depois dos destinos.
  const groupIcon=
   img(head)||
   img(group.slice(b+1))||
   GROUP_ICONS[g]||
   '';

  gs.push({id:g,name:groupName});

  for(const item of objects(group.slice(a+1,b))){
   const c=coords(item);
   if(!c)continue;

   const id=value(item,'id');
   const code=value(item,'code')||
    (g==='fairyring'?id:'');

   ts.push({
    ...c,
    ...targetSize(item),
    group:g,
    groupName,
    id,
    name:value(item,'name')||groupName,
    code,
    icon:img(item)||groupIcon
   });
  }
 }

 if(ts.length<350){
  throw Error('Dados de teleportes incompletos');
 }

 return {groups:gs,teleports:ts};
}

function applyTeleports(data){
 const source=Array.isArray(data.teleports)
  ?data.teleports
  :[];

 const all=[...source,...MANUAL].map(t=>({
  ...t,
  code:shownCode(t),
  icon:t.icon||GROUP_ICONS[t.group]||''
 }));

 const ids=new Set();

 teleports=all.filter(t=>{
  if(!t||!t.group||!t.id)return false;

  const k=t.group+':'+t.id;

  if(ids.has(k))return false;

  ids.add(k);
  return true;
 });

 const suppliedGroups=Array.isArray(data.groups)
  ?data.groups
  :[];

 groups=[
  ...suppliedGroups,
  ...MANUAL.map(t=>({
   id:t.group,
   name:t.groupName
  }))
 ].filter((g,i,arr)=>
  g&&g.id&&
  arr.findIndex(x=>x.id===g.id)===i
 );

 teleReady=true;

 $('msg').textContent=
  `${teleports.length} destinos carregados`;

 drawTeleports();
 calculateTrip();
}

async function loadTeleports(){
 let cache=load('gps-transportes-cache-v1');

 try{
  let entries=Array.isArray(cache.spots)
   ?cache.spots
   :cache.teleports;

  const currentCache=cache.targetSizeVersion===2;

  if(
   !Array.isArray(entries)||
   entries.length<350||
   !currentCache
  ){
   const response=await fetch(TELE_URL);

   if(!response.ok){
    throw Error('HTTP '+response.status);
   }

   const parsed=parseData(await response.text());

   cache={
    groups:parsed.groups,
    spots:parsed.teleports,
    targetSizeVersion:2
   };

   entries=cache.spots;

   try{
    localStorage.setItem(
     'gps-transportes-cache-v1',
     JSON.stringify(cache)
    );
   }catch(_){}
  }

  applyTeleports({
   groups:cache.groups,
   teleports:entries
  });

 }catch(error){
  console.warn(
   'Base de teleportes indisponível',
   error
  );

  const fallback=Array.isArray(cache.spots)
   ?cache.spots
   :cache.teleports;

  applyTeleports({
   groups:cache.groups||[],
   teleports:Array.isArray(fallback)
    ?fallback
    :[]
  });

  $('msg').textContent=
   'Base remota não atualizou; usando cache disponível';
 }
}

const routeKey=r=>r[0]+':'+r[1];

const findTeleport=r=>
 teleports.find(t=>
  t.group===r[0]&&t.id===r[1]
 );

const curated=e=>
 e.routes.filter(r=>
  state.enabled[r[0]]===true
 );

function matchesMap(e,t){
 return !!t&&
  !t.special&&
  Number.isFinite(t.x)&&
  Number.isFinite(t.y)&&
  t.level===e.level&&
  mapFor(t)===e.map;
}

function optionsFor(e){
 const preset=curated(e);

 if(
  !state.auto||
  ['elder','jas','gnome','naragi'].includes(e.id)
 ){
  return preset;
 }

 const ids=new Set(preset.map(routeKey));

 const extras=teleports.filter(t=>
  t.id&&
  state.enabled[t.group]===true&&
  matchesMap(e,t)&&
  Math.max(
   Math.abs(t.x-e.x),
   Math.abs(t.y-e.y)
  )<=330&&
  !ids.has(t.group+':'+t.id)
 ).map(t=>[
  t.group,
  t.id,
  'Use '+t.groupName+' → '+t.name+
  ' e siga o percurso mostrado no mapa.'
 ]);

 return preset.concat(extras);
}

// ==========================================
// 2. MOTOR DE CAMINHADA
// ==========================================

const BLOCK=1280;

const DIRS=[
 [-1,0,1,4],
 [0,1,2,8],
 [1,0,4,1],
 [0,-1,8,2],
 [-1,1,16,64],
 [1,1,32,128],
 [1,-1,64,16],
 [-1,-1,128,32]
];

const collisionFiles=new Map();

async function getCollision(fx,fy,level){
 const key=`${fx}-${fy}-${level}`;

 if(!collisionFiles.has(key)){
  const job=(async()=>{
   if(typeof pako==='undefined'){
    throw Error('pako ausente');
   }

   const r=await fetch(
    `${COL_URL}collision-${key}.bin`
   );

   if(!r.ok){
    throw Error(
     'Arquivo de colisão HTTP '+r.status
    );
   }

   const a=pako.inflate(
    new Uint8Array(await r.arrayBuffer())
   );

   if(a.length!==BLOCK*BLOCK){
    throw Error('Formato de colisão inválido');
   }

   return a;
  })();

  collisionFiles.set(key,job);
 }

 try{
  return await collisionFiles.get(key);
 }catch(e){
  collisionFiles.delete(key);
  throw e;
 }
}

function collisionChunks(e,radius){
 const box={
  minX:Math.max(0,e.x-radius),
  maxX:e.x+radius,
  minY:Math.max(0,e.y-radius),
  maxY:e.y+radius
 };

 return {
  box,
  fetch:async()=>{
   const chunks=new Map();
   const jobs=[];

   for(
    let fy=Math.floor(box.minY/BLOCK);
    fy<=Math.floor(box.maxY/BLOCK);
    fy++
   ){
    for(
     let fx=Math.floor(box.minX/BLOCK);
     fx<=Math.floor(box.maxX/BLOCK);
     fx++
    ){
     jobs.push(
      getCollision(fx,fy,e.level)
       .then(a=>chunks.set(fx+','+fy,a))
     );
    }
   }

   await Promise.all(jobs);

   return (x,y)=>{
    if(
     x<box.minX||x>box.maxX||
     y<box.minY||y>box.maxY
    )return 0;

    const fx=Math.floor(x/BLOCK);
    const fy=Math.floor(y/BLOCK);

    const a=chunks.get(fx+','+fy);

    return a
     ?a[(y%BLOCK)*BLOCK+(x%BLOCK)]
     :0;
   };
  }
 };
}

function distance(a,b){
 return Math.max(
  Math.abs(a.x-b.x),
  Math.abs(a.y-b.y)
 );
}

let routeRun=0;
let walkResults=[];
let boatWalk=[];
let routeStatus='';
let partialSearch=false;

function disabledRoute(e,r){
 return (
  e.id==='elder'||
  (e.id==='jas'&&routeKey(r)==='home:falador')
 );
}

async function terrainRoutes(e,candidates,epoch){
 const R=330;

 const {box,fetch:prepare}=
  collisionChunks(e,R);

 const at=await prepare();

 if(epoch!==routeRun)return [];

 const w=box.maxX-box.minX+1;
 const len=w*(box.maxY-box.minY+1);

 const inside=(x,y)=>
  x>=box.minX&&x<=box.maxX&&
  y>=box.minY&&y<=box.maxY;

 const id=(x,y)=>
  (y-box.minY)*w+x-box.minX;

 const xOf=i=>i%w+box.minX;

 const yOf=i=>
  Math.floor(i/w)+box.minY;

 const dist=new Int32Array(len);
 dist.fill(-1);

 const next=new Int32Array(len);
 next.fill(-1);

 const queue=new Int32Array(len);

 let front=0;
 let back=0;

 // O objeto pode exigir interação nas casas
 // próximas. Não se considera uma rota
 // verdadeira a partir de qualquer ponto distante.
 const GOAL_RADIUS=2;

 for(let dy=-GOAL_RADIUS;dy<=GOAL_RADIUS;dy++){
  for(let dx=-GOAL_RADIUS;dx<=GOAL_RADIUS;dx++){
   const x=e.x+dx;
   const y=e.y+dy;

   if(!inside(x,y)||at(x,y)===0)continue;

   const i=id(x,y);

   if(dist[i]>=0)continue;

   dist[i]=0;
   queue[back++]=i;
  }
 }

 if(!back)return [];

 const targets=candidates.filter(({t})=>
  matchesMap(e,t)&&
  distance(t,e)<=R
 );

 if(!targets.length)return [];

 let hitCap=false;

 const HARD_CAP=Math.min(len-1,400000);

 while(front<back){
  if(epoch!==routeRun)return [];

  const cur=queue[front++];
  const x=xOf(cur);
  const y=yOf(cur);

  for(const [dx,dy,bit,inverse] of DIRS){
   const nx=x+dx;
   const ny=y+dy;

   if(!inside(nx,ny))continue;

   const ni=id(nx,ny);

   if(
    dist[ni]!==-1||
    (at(nx,ny)&inverse)===0
   )continue;

   dist[ni]=dist[cur]+1;
   next[ni]=cur;
   queue[back++]=ni;
  }

  if(front%2500===0){
   await new Promise(done=>
    setTimeout(done,0)
   );
  }

  if(back>=HARD_CAP){
   hitCap=true;
   break;
  }
 }

 partialSearch=hitCap;

 const results=[];

 for(const {route,t} of targets){
  const width=Math.min(
   16,Math.max(1,Number(t.width)||1)
  );

  const height=Math.min(
   16,Math.max(1,Number(t.height)||1)
  );

  let best=-1;
  let bestCost=Infinity;
  let bestSnap=Infinity;

  // Usa a área de chegada do teleporte.
  // No máximo uma casa de tolerância.
  for(let dy=-1;dy<=height;dy++){
   for(let dx=-1;dx<=width;dx++){
    const x=t.x+dx;
    const y=t.y+dy;

    if(!inside(x,y))continue;

    const i=id(x,y);
    const d=dist[i];

    if(d<0)continue;

    const snap=Math.max(
     0,
     -dx,
     dx-width+1,
     -dy,
     dy-height+1
    );

    const cost=d+snap;

    if(cost<bestCost){
     bestCost=cost;
     best=i;
     bestSnap=snap;
    }
   }
  }

  if(best<0)continue;

  const raw=[];
  let p=best;

  while(p>=0&&raw.length<2500){
   raw.push([yOf(p),xOf(p)]);
   p=next[p];
  }

  if(p>=0||!raw.length)continue;

  const start={
   x:raw[0][1],
   y:raw[0][0]
  };

  const goal={
   x:raw[raw.length-1][1],
   y:raw[raw.length-1][0]
  };

  if(
   distance(goal,e)>GOAL_RADIUS||
   bestSnap>1
  )continue;

  const minDist=Math.max(
   0,
   distance(t,e)-
   GOAL_RADIUS-
   bestSnap-
   Math.max(width,height)+1
  );

  if(raw.length-1<minDist)continue;

  // Confere todas as arestas do caminho.
  let valid=true;

  for(let i=1;i<raw.length;i++){
   const prev=raw[i-1];
   const cur=raw[i];

   const dx=cur[1]-prev[1];
   const dy=cur[0]-prev[0];

   const entry=DIRS.find(d=>
    d[0]===dx&&d[1]===dy
   );

   if(
    !entry||
    (at(prev[1],prev[0])&entry[2])===0
   ){
    valid=false;
    break;
   }
  }

  if(!valid)continue;

  // Remove pontos intermediários na mesma
  // direção, preservando as curvas do caminho.
  const reduced=[raw[0]];
  let last='';

  for(let i=1;i<raw.length;i++){
   const dir=[
    Math.sign(raw[i][1]-raw[i-1][1]),
    Math.sign(raw[i][0]-raw[i-1][0])
   ].join(',');

   if(i>1&&dir!==last){
    reduced.push(raw[i-1]);
   }

   last=dir;
  }

  if(raw.length>1){
   reduced.push(raw[raw.length-1]);
  }

  results.push({
   key:routeKey(route),
   route,
   t,
   steps:raw.length-1,
   snap:bestSnap,
   path:reduced,
   goalRadius:GOAL_RADIUS,
   goalDistance:distance(goal,e),
   source:start,
   finish:goal
  });
 }

 return results.sort((a,b)=>
  (a.steps+a.snap)-(b.steps+b.snap)
 );
}

// 3. CÁLCULO DA VIAGEM
// ==========================================

function bestRoute(e){
 const opts=optionsFor(e);

 const chosen=opts.find(r=>
  routeKey(r)===state.selected[e.id]
 );

 if(chosen)return chosen;

 if(state.auto){
  const found=walkResults.find(x=>
   opts.some(r=>
    routeKey(r)===x.key
   )
  );

  if(found)return found.route;
 }

 if(e.id==='elder'){
  const seal=opts.find(r=>
   routeKey(r)==='voidseal:outpost'
  );

  if(seal)return seal;
 }

 return opts[0]||e.routes[0];
}

async function calculateTrip(){
 const token=++routeRun;
 const e=current();

 walkResults=[];
 boatWalk=[];
 partialSearch=false;

 drawWalk();

 if(!state.showPath){
  routeStatus=
   'Caminhada visual desativada. Instruções disponíveis abaixo.';

  renderText();
  drawStages();
  drawWalk();
  return;
 }

 if(!teleReady){
  routeStatus='Carregando teleportes…';
  renderText();
  return;
 }

 if(!optionsFor(e).length){
  routeStatus=
   'Nenhum transporte habilitado. Abra Config. para selecionar os que possui.';

  renderText();
  drawStages();
  return;
 }

 if(
  e.id==='elder'&&
  routeKey(bestRoute(e))==='voidseal:outpost'
 ){
  routeStatus=
   'Selo dos Void Knights: teleporte direto para a ilha. Siga ao barril próximo ao banco.';

  renderText();
  drawStages();
  return;
 }

 if(e.id==='elder'){
  routeStatus=
   'Barco necessário: Port Sarim → Squire → cais da ilha → barril.';

  renderText();
  drawStages();

  const legs=[];

  if(state.enabled.home){
   const origin=findTeleport([
    'home','portsarim'
   ]);

   if(origin){
    legs.push({
     name:'Port Sarim → Squire',
     goal:{
      ...DOCKS.embark,
      level:0,
      map:28
     },
     route:[
      'home',
      'portsarim',
      'Vá ao Squire'
     ],
     t:origin
    });
   }
  }

  legs.push({
   name:'Cais → barril',
   goal:e,
   route:[
    'boat',
    'arrival',
    'Na ilha vá ao barril'
   ],
   t:{
    ...DOCKS.arrive,
    level:0,
    map:28,
    group:'boat',
    id:'arrival',
    groupName:'Barco',
    name:'Cais da ilha'
   }
  });

  const solved=await Promise.all(
   legs.map(async leg=>{
    try{
     const paths=await terrainRoutes(
      leg.goal,
      [{route:leg.route,t:leg.t}],
      token
     );

     return paths.length
      ?{...paths[0],name:leg.name}
      :null;
    }catch(_){
     return null;
    }
   })
  );

  if(token!==routeRun)return;

  boatWalk=solved.filter(Boolean);

  routeStatus=boatWalk.length
   ?'Trechos verdes: '+
    boatWalk.map(x=>
     x.name+
     ' (aprox. '+
     (x.steps+x.snap)+
     ' passos)'
    ).join(' · ')+
    '. Entre os cais, use o barco. Os cais são pontos aproximados.'
   :'Use o barco do Squire. Não foi possível validar os trechos em terra.';

  if(!boatWalk.some(x=>
   x.name==='Cais → barril'
  )){
   routeStatus+=
    ' A orientação aproximada na ilha pode ser habilitada em Config.';
  }

  renderText();
  drawWalk();
  drawStages();
  fitSelectedRoute();
  return;
 }

 if(e.id==='naragi'){
  routeStatus=
   'Naragun: mapa real no plano 2. Use AIS e siga as etapas. Guia visual aproximado opcional.';

  renderText();
  drawWalk();
  return;
 }

 const candidates=optionsFor(e)
  .filter(r=>!disabledRoute(e,r))
  .map(route=>({
   route,
   t:findTeleport(route)
  }))
  .filter(x=>
   x.t&&matchesMap(e,x.t)
  );

 if(!candidates.length){
  routeStatus=
   'Sem teleporte direto com mapa e andar compatíveis. Siga as etapas indicadas.';

  renderText();
  return;
 }

 routeStatus=
  `Calculando ${candidates.length} alternativas na região…`;

 renderText();

 try{
  const routes=await terrainRoutes(
   e,candidates,token
  );

  if(token!==routeRun)return;

  walkResults=routes;

  routeStatus=routes.length
   ?`Trajetos conectados à área do objeto: ${routes.length} chegada(s) compatíveis${partialSearch?' (busca limitada)':''}.`
   :e.id==='sheep'
    ?'Colisão não conectou Fred ao teleporte. O guia opcional não é uma rota validada.'
    :'Nenhuma conexão caminhável verificada. As etapas escritas continuam disponíveis.';

 }catch(error){
  if(token!==routeRun)return;

  routeStatus=
   'Sem dados de colisão para esta região: '+
   error.message+
   '. Use as instruções da Wiki.';
 }

 renderText();
 drawWalk();
 drawTeleports();
 drawStages();
 fitSelectedRoute();
}

function chooseRoute(route){
 state.selected[current().id]=routeKey(route);

 persist();
 renderText();
 drawWalk();
 drawTeleports();
 drawStages();
 fitSelectedRoute();
}

function recalculate(){
 delete state.selected[current().id];

 persist();
 calculateTrip();
}

let map=null;
let tile=null;
let mapCode=null;
let destMarker=null;
let walkLayer=null;
let tpLayer=null;
let stageLayer=null;

function initMap(){
 if(map||typeof L==='undefined')return;

 map=L.map('map',{
  crs:L.CRS.Simple,
  zoomControl:true,
  minZoom:-3,
  maxZoom:4,
  zoomSnap:1,
  attributionControl:true
 });

 walkLayer=L.layerGroup().addTo(map);
 stageLayer=L.layerGroup().addTo(map);
 tpLayer=L.layerGroup().addTo(map);

 map.on('moveend zoomend',drawTeleports);
}

function changeMap(){
 initMap();
 if(!map)return;

 const e=current();
 const display=displayMap(e);

 const code=`${display.id}:${display.plane}`;

 if(mapCode!==code){
  if(tile){
   map.removeLayer(tile);
  }

  tile=null;

  map.getContainer().style.background=
   '#182923';

  const Tiles=L.TileLayer.extend({
   getTileUrl(c){
    return `${TILE_URL}/${display.id}/${c.z}/${display.plane}_${c.x}_${-1-c.y}.png`;
   }
  });

  tile=new Tiles('',{
   minZoom:-3,
   maxZoom:4,
   maxNativeZoom:3,
   tileSize:256,
   noWrap:true,
   attribution:
    'Mapa: mejrs / RuneScape Wiki • © Jagex'
  }).addTo(map);

  mapCode=code;
 }

 if(destMarker){
  destMarker.remove();
 }

 destMarker=L.marker([e.y,e.x],{
  icon:L.divIcon({
   className:'',
   html:'<div class="dest"></div>',
   iconSize:[21,21],
   iconAnchor:[10,10]
  }),
  zIndexOffset:1000
 }).addTo(map);

 destMarker.bindPopup(
  `${e.name} — X ${e.x}, Y ${e.y}`+
  (e.approx?' (revisão visual)':'')
 );

 map.setView(
  [e.y,e.x],
  e.map===28?2:3,
  {animate:false}
 );

 setTimeout(()=>map.invalidateSize(),60);

 drawStages();
 drawWalk();
 drawTeleports();
}

function iconFor(t,highlight){
 const el=document.createElement('div');

 el.className=
  'tp'+(highlight?' best':'');

 const fallback=()=>{
  const f=document.createElement('span');
  f.className='fallback';
  f.textContent='◈';
  el.prepend(f);
 };

 if(t.icon){
  const image=document.createElement('img');

  image.src=
   ICON_URL+encodeURIComponent(t.icon);

  image.alt='';

  image.onerror=()=>{
   image.remove();
   fallback();
  };

  el.append(image);
 }else{
  fallback();
 }

 const shortcut=shownCode(t);

 if(shortcut){
  const k=document.createElement('span');
  k.className='key';
  k.textContent=shortcut;
  el.append(k);
 }

 return L.divIcon({
  className:'',
  html:el,
  iconSize:[30,30],
  iconAnchor:[15,15]
 });
}

function drawTeleports(){
 if(!map||!tpLayer)return;

 tpLayer.clearLayers();

 if(!state.showTP)return;

 const e=current();
 const chosen=bestRoute(e);
 const options=optionsFor(e);

 const allowed=new Set(
  options.map(routeKey)
 );

 const bounds=map.getBounds().pad(.25);

 for(const t of teleports){
  if(
   !state.enabled[t.group]||
   !matchesMap(e,t)
  )continue;

  const key=t.group+':'+t.id;

  if(
   !state.allTP&&
   !allowed.has(key)
  )continue;

  if(!bounds.contains([t.y,t.x])){
   continue;
  }

  const selected=
   routeKey(chosen)===key;

  const marker=L.marker([t.y,t.x],{
   icon:iconFor(t,selected),
   title:t.groupName+' — '+t.name,
   zIndexOffset:selected?700:0
  }).addTo(tpLayer);

  const body=document.createElement('div');

  const heading=document.createElement('b');
  heading.textContent=
   t.groupName+' — '+t.name;

  body.append(heading);

  const detail=document.createElement('p');

  detail.textContent=shownCode(t)
   ?'Código/opção: '+shownCode(t)
   :'Consulte a opção no jogo';

  body.append(detail);

  const r=options.find(x=>
   routeKey(x)===key
  );

  if(r){
   const btn=document.createElement('button');
   btn.textContent='Usar este teleporte';

   btn.onclick=()=>{
    chooseRoute(r);
    map.closePopup();
   };

   body.append(btn);
  }

  marker.bindPopup(body);
 }
}

function fitSelectedRoute(){
 if(!map)return;

 const e=current();
 const r=bestRoute(e);

 let points=[];

 if(e.id==='elder'&&boatWalk.length){
  points=boatWalk
   .filter(p=>p.name==='Cais → barril')
   .map(p=>p.path)
   .flat();
 }else{
  const chosen=walkResults.find(p=>
   p.key===routeKey(r)
  );

  if(chosen){
   points=chosen.path;
  }
 }

 if(points.length<2)return;

 const bounds=L.latLngBounds([
  ...points,
  [e.y,e.x]
 ]);

 if(!bounds.isValid())return;

 map.fitBounds(bounds,{
  padding:[55,55],
  maxZoom:3,
  animate:false
 });
}

function drawLastInteraction(path,goal){
 if(!path||!path.length||!goal)return;

 const last=path[path.length-1];

 const d=Math.max(
  Math.abs(last[1]-goal.x),
  Math.abs(last[0]-goal.y)
 );

 if(d>0&&d<=2){
  L.polyline(
   [last,[goal.y,goal.x]],
   {
    color:'#f8d78b',
    weight:2,
    dashArray:'2 5',
    interactive:false
   }
  ).addTo(walkLayer);
 }
}

function dashedGuide(points,label){
 if(
  !map||
  !walkLayer||
  !points||
  points.length<2
 )return;

 L.polyline(points,{
  color:'#efba55',
  weight:4,
  opacity:.95,
  dashArray:'6 8',
  lineCap:'round',
  interactive:false
 }).addTo(walkLayer);

 const n=$('routeLegend');

 n.textContent=label;
 n.style.display='block';
}

function drawWalk(){
 if(!map||!walkLayer)return;

 walkLayer.clearLayers();
 $('routeLegend').style.display='none';

 if(!state.showPath)return;

 const e=current();

 if(e.id==='elder'){
  for(const seg of boatWalk){
   L.polyline(seg.path,{
    color:'#0c2b24',
    weight:8,
    interactive:false
   }).addTo(walkLayer);

   L.polyline(seg.path,{
    color:'#68f1b9',
    weight:4,
    interactive:false
   }).addTo(walkLayer);

   if(seg.name==='Cais → barril'){
    drawLastInteraction(seg.path,e);
   }
  }

  if(
   state.showGuides&&
   routeKey(bestRoute(e))==='home:portsarim'&&
   !boatWalk.some(x=>x.name==='Cais → barril')
  ){
   dashedGuide(
    LAND_GUIDES.elder,
    'Ilha: orientação aproximada do cais até o barril, não validada'
   );
  }

  return;
 }

 if(e.id==='naragi'&&state.showGuides){
  dashedGuide(
   LAND_GUIDES.naragi,
   'Naragun: AIS → norte → oeste. Percurso indicativo.'
  );

  return;
 }

 const r=bestRoute(e);

 const res=walkResults.find(x=>
  x.key===routeKey(r)
 );

 if(res){
  L.polyline(res.path,{
   color:'#0c2b24',
   weight:8,
   interactive:false
  }).addTo(walkLayer);

  L.polyline(res.path,{
   color:'#68f1b9',
   weight:4,
   interactive:false
  }).addTo(walkLayer);

  drawLastInteraction(res.path,e);
  return;
 }

 if(
  e.id==='sheep'&&
  teleReady&&
  state.showGuides
 ){
  const t=findTeleport(r);

  if(
   t&&
   matchesMap(e,t)&&
   distance(e,t)<=170
  ){
   const midY=e.y-23;

   dashedGuide(
    [
     [t.y,t.x],
     [midY,t.x],
     [e.y-8,e.x+8],
     [e.y,e.x]
    ],
    'Sheep: orientação aproximada, não validada por colisão'
   );
  }
 }
}

function drawStages(){
 if(!map||!stageLayer)return;

 stageLayer.clearLayers();

 const e=current();

 if(
  e.id!=='elder'||
  routeKey(bestRoute(e))!=='home:portsarim'
 )return;

 for(const [p,label] of [
  [DOCKS.embark,'Embarque: Squire'],
  [DOCKS.arrive,'Chegada: Void Knights']
 ]){
  L.marker([p.y,p.x],{
   icon:L.divIcon({
    className:'',
    html:'<div class="waypoint">⚓</div>',
    iconSize:[25,25],
    iconAnchor:[12,12]
   }),
   title:label
  }).addTo(stageLayer)
   .bindPopup(
    label+
    ' — marcador aproximado do cais, não uma coordenada verificada.'
   );
 }
}

// ==========================================
// 5. INTERFACE
// ==========================================

function renderText(){
 const e=current();
 const r=bestRoute(e);
 const t=findTeleport(r);
 const progress=state.done[state.prestige]||{};

 $('title').textContent=
  e.name+' — '+e.area;

 $('counter').textContent=
  `Engrama ${state.index+1}/12 · Prestígio ${state.prestige}`;

 $('teleTitle').textContent=
  !optionsFor(e).length
   ?'Nenhum teleporte habilitado para este destino'
   :t
    ?`Teleporte: ${t.groupName} → ${t.name}${shownCode(t)?' ['+shownCode(t)+']':''}`
    :'Opção cadastrada: '+r[0];

 $('instructions').textContent=
  !optionsFor(e).length
   ?'Abra Config. e habilite um dos transportes disponíveis.'
   :'1. '+r[2];

 $('where').textContent=
  '2. Local: '+e.where;

 const path=walkResults.find(x=>
  x.key===routeKey(r)
 );

 $('routeStatus').textContent=
  path
   ?`↳ ${path.steps} casas de caminhada calculadas; os últimos ${path.goalDistance} quadrados até o engrama podem exigir interação. ${partialSearch?'Busca parcial; melhor rota não garantida.':''}`
   :routeStatus;

 $('warning').textContent=
  (e.req?'⚠ '+e.req+' · ':'')+
  `Destino: X ${e.x}, Y ${e.y}`+
  (e.approx?' (posição sob revisão visual)':'')+
  '.';

 $('choices').replaceChildren();

 const opts=optionsFor(e);

 const sorted=opts.length>18
  ?[
   r,
   ...opts.filter(x=>
    routeKey(x)!==routeKey(r)
   ).slice(0,17)
  ]
  :opts;

 for(const option of sorted){
  const info=findTeleport(option);
  const btn=document.createElement('button');

  btn.textContent=info
   ?`${info.groupName} ${shownCode(info)||info.name}`
   :option[0];

  btn.title=option[2];

  btn.className=
   routeKey(r)===routeKey(option)
    ?'active'
    :'';

  btn.onclick=()=>chooseRoute(option);

  $('choices').append(btn);
 }

 const trip=$('tripSteps');
 const actions=$('tripActions');

 trip.replaceChildren();
 actions.replaceChildren();

 const steps=
  (e.id==='elder'&&
   routeKey(r)==='voidseal:outpost')
   ?[
    'Use o Void knight seal para chegar diretamente ao posto avançado.',
    'Na ilha, siga a sudeste, a leste do banco, até o barril do engrama.'
   ]
   :(CONNECTIONS[e.id]?.stages||[]);

 trip.style.display=
  steps.length?'block':'none';

 steps.forEach((step,i)=>{
  const p=document.createElement('div');
  p.className='segment';

  p.textContent=`${i+1}. ${step}`;
  trip.append(p);
 });

 if(
  e.id==='elder'&&
  routeKey(r)==='home:portsarim'
 ){
  for(const [txt,pt] of [
   ['⚓ Embarque',DOCKS.embark],
   ['⚓ Chegada',DOCKS.arrive],
   ['⌖ Destino',e]
  ]){
   const btn=document.createElement('button');
   btn.textContent=txt;

   btn.onclick=()=>{
    map?.setView([pt.y,pt.x],3);
   };

   actions.append(btn);
  }
 }

 $('done').textContent=
  progress[e.id]
   ?'↶ Desmarcar'
   :'✓ Coletado e próximo';

 $('progress').textContent=
  `${ENGRAMS.filter(x=>progress[x.id]).length}/12 coletados · Progresso salvo`;

 $('routeBox').style.display=
  state.compact?'none':'block';

 $('collapse').textContent=
  state.compact
   ?'▸ Roteiro'
   :'▾ Roteiro';

 $('showTeleports').textContent=
  state.showTP
   ?'Teleportes ✓'
   :'Teleportes ✕';

 $('showPath').textContent=
  state.showPath
   ?'Rota ✓'
   :'Rota ✕';

 $('wiki').onclick=()=>window.open(
  'https://runescape.wiki/w/'+
  encodeURIComponent(
   e.name.replaceAll(' ','_')+'_engram'
  ),
  '_blank'
 );

 $('msg').textContent=
  e.map===649
   ?'Naragun: mapa real, navegação por etapas'
   :teleReady
    ?`${teleports.length} destinos na base de teleportes`
    :'Carregando catálogo de teleportes…';
}

function render(){
 ++routeRun;

 walkResults=[];
 boatWalk=[];
 routeStatus='';

 renderText();
 changeMap();
 persist();
 calculateTrip();
}

function advance(n){
 state.index=
  (state.index+n+ENGRAMS.length)%
  ENGRAMS.length;

 render();
}

$('prev').onclick=()=>advance(-1);
$('next').onclick=()=>advance(1);

$('done').onclick=()=>{
 const bucket=
  state.done[state.prestige]||
  (state.done[state.prestige]={});

 const id=current().id;

 if(bucket[id]){
  delete bucket[id];
  renderText();
  persist();
 }else{
  bucket[id]=true;
  advance(1);
 }
};

$('center').onclick=()=>{
 const e=current();

 map?.setView(
  [e.y,e.x],
  e.map===28?2:3
 );
};

$('showTeleports').onclick=()=>{
 state.showTP=!state.showTP;
 persist();
 renderText();
 drawTeleports();
};

$('showPath').onclick=()=>{
 state.showPath=!state.showPath;
 persist();
 calculateTrip();
};

$('recalc').onclick=()=>recalculate();

$('collapse').onclick=()=>{
 state.compact=!state.compact;
 persist();
 renderText();

 setTimeout(
  ()=>map?.invalidateSize(),
  40
 );
};

// ==========================================
// 6. MODAIS
// ==========================================

function openModal(title){
 $('modalTitle').textContent=title;
 $('modalBody').replaceChildren();
 $('overlay').classList.add('show');
 $('save').style.display='block';
}

function closeModal(){
 $('overlay').classList.remove('show');
}

$('cancel').onclick=closeModal;

function option(parent,label,checked){
 const wrap=document.createElement('label');
 wrap.className='check';

 const c=document.createElement('input');
 c.type='checkbox';
 c.checked=checked;

 wrap.append(
  c,
  document.createTextNode(label)
 );

 parent.append(wrap);
 return c;
}

$('list').onclick=()=>{
 openModal('Engramas · marcar coleta');
 $('save').style.display='none';

 const root=$('modalBody');

 const intro=document.createElement('p');
 intro.className='dim';

 intro.textContent=
  'Clique na bolinha para marcar. Clique no nome para abrir o destino.';

 root.append(intro);

 let armed=false;

 const reset=document.createElement('button');
 reset.type='button';
 reset.style=
  'width:100%;margin-bottom:10px;background:#673e35';

 reset.textContent=
  '↺ Reiniciar coleta deste prestígio';

 reset.onclick=()=>{
  if(!armed){
   armed=true;

   reset.textContent=
    'Confirmar reinício dos 12? (clique novamente)';

   reset.style.background='#ad4440';
   return;
  }

  state.done[state.prestige]={};

  persist();
  closeModal();
  renderText();
  $('list').click();
 };

 root.append(reset);

 ENGRAMS.forEach((e,i)=>{
  const row=document.createElement('div');

  row.style=
   'display:flex;gap:6px;margin:4px 0';

  const status=document.createElement('button');

  status.style=
   'width:38px;flex-shrink:0;font-size:18px';

  const title=document.createElement('button');

  title.style=
   'flex:1;text-align:left';

  const update=()=>{
   const done=
    !!state.done[state.prestige]?.[e.id];

   status.textContent=
    done?'●':'○';

   status.style.color=
    done?'#70e9a9':'#cedcd4';

   title.textContent=
    `${i+1}. ${e.name} — ${e.area}`+
    (done?' ✓':'');
  };

  status.onclick=()=>{
   const bucket=
    state.done[state.prestige]||
    (state.done[state.prestige]={});

   if(bucket[e.id]){
    delete bucket[e.id];
   }else{
    bucket[e.id]=true;
   }

   persist();
   renderText();
   update();
  };

  title.onclick=()=>{
   state.index=i;
   closeModal();
   render();
  };

  update();

  row.append(status,title);
  root.append(row);
 });
};

$('settings').onclick=()=>{
 openModal('⚙ Configurações');

 const root=$('modalBody');
 const draft={...state.enabled};

 const prestige=document.createElement('label');
 prestige.textContent='Prestígio: ';

 const n=document.createElement('input');

 n.type='number';
 n.min='1';
 n.max='999';
 n.value=state.prestige;

 prestige.append(n);
 root.append(prestige);

 const auto=option(
  root,
  'Comparar automaticamente os teleportes calculáveis',
  state.auto
 );

 const all=option(
  root,
  'Mostrar todos os ícones dos teleportes habilitados',
  state.allTP
 );

 const show=option(
  root,
  'Desenhar trajetos caminháveis quando encontrados',
  state.showPath
 );

 const guides=option(
  root,
  'Mostrar guias aproximados (amarelo pontilhado; NÃO é caminho validado)',
  state.showGuides
 );

 const search=document.createElement('input');

 search.type='search';
 search.placeholder='Buscar teleporte…';

 root.append(search);

 const field=document.createElement('fieldset');

 const legend=document.createElement('legend');
 legend.textContent='Transportes que possuo';

 field.append(legend);
 root.append(field);

 const rowButtons=document.createElement('div');

 rowButtons.style=
  'display:flex;gap:6px;margin-bottom:9px';

 const toggleAll=document.createElement('button');

 toggleAll.type='button';
 toggleAll.textContent='Marcar todos';

 const toggleNone=document.createElement('button');

 toggleNone.type='button';
 toggleNone.textContent='Desmarcar todos';

 rowButtons.append(toggleAll,toggleNone);
 field.append(rowButtons);

 const rows=[];

 for(const g of groups){
  const c=option(
   field,
   g.name,
   !!draft[g.id]
  );

  c.onchange=()=>{
   draft[g.id]=c.checked;
  };

  rows.push({
   name:g.name,
   el:c.parentElement,
   c,
   id:g.id
  });
 }

 toggleAll.onclick=()=>{
  rows.forEach(r=>{
   r.c.checked=true;
   draft[r.id]=true;
  });
 };

 toggleNone.onclick=()=>{
  rows.forEach(r=>{
   r.c.checked=false;
   draft[r.id]=false;
  });
 };

 search.oninput=()=>{
  rows.forEach(x=>{
   x.el.style.display=
    x.name.toLowerCase().includes(
     search.value.toLowerCase()
    )
     ?'flex'
     :'none';
  });
 };

 if(!rows.length){
  field.append(
   'Aguardando catálogo externo.'
  );
 }

 const hint=document.createElement('p');
 hint.className='dim';

 hint.textContent=
  'Verde = caminhada validada. '+
  'Amarelo curto = aproximação final do objeto. '+
  'Amarelo longo pontilhado = orientação opcional. '+
  'Salvar recalcula e preserva as rotas escolhidas manualmente.';

 root.append(hint);

 $('save').onclick=()=>{
  state.prestige=Math.max(
   1,
   Math.min(999,Number(n.value)||1)
  );

  state.enabled=draft;
  state.auto=auto.checked;
  state.allTP=all.checked;
  state.showPath=show.checked;
  state.showGuides=guides.checked;

  for(const [id,key] of Object.entries(
   state.selected
  )){
   const group=String(key).split(':')[0];

   if(!state.enabled[group]){
    delete state.selected[id];
   }
  }

  persist();
  closeModal();
  render();
 };
};

// ==========================================
// INICIALIZAÇÃO
// ==========================================

render();
loadTeleports();

</script>
</body>
</html>
